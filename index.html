<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Momentum - yet another task manager</title>
<script src="art-data.js"></script>
<link rel="stylesheet" href="momentum.css">
</head>
<body>

<header>
  <div class="title"><span>MOMENTUM</span></div>
  <div class="stats" id="stats">loading...</div>
</header>

<div id="main">
  <div id="term-wrap">
    <div id="list-pane" class="slot-stacked"></div>
    <div id="split-divider" title="drag to resize"></div>
    <div id="console">
      <div id="output"></div>
      <div id="input-row">
        <span id="prompt">$</span>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus />
      </div>
    </div>
  </div>
  <div id="col-divider" title="drag to resize"></div>
  <div id="reveal-panel" class="slot-side"></div>
</div>

<script src="app-state.js"></script>
<script src="app-art.js"></script>
<script src="app-commands.js"></script>
<script src="app-render.js"></script>
</body>
</html>
