  const beforeCount = track.progress.revealedCount, beforeTotal = from.cols * from.rows;
  const oldOrder = materializeOrder(track.progress, beforeTotal);
  art.cols = to.cols; art.rows = to.rows;
  Object.assign(track.progress, remapReveal(oldOrder, beforeCount, from, to, track.pending));
  saveState(); renderPanel();

  const afterTotal = to.cols * to.rows;
  const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
  print(`block size: ${describeBlockSize()}  —  ${from.cols}x${from.rows} → ${to.cols}x${to.rows}  (${beforeTotal} → ${afterTotal} blocks)`, 'ok');
  if(beforeCount > 0){
    print(`kept what you'd uncovered: ${beforeCount}/${beforeTotal} (${pct(beforeCount, beforeTotal)}%) → ${track.progress.revealedCount}/${afterTotal} (${pct(track.progress.revealedCount, afterTotal)}%) — same region, new block size`, 'info');
  }
}

function cmd_blockCount(arg){
  if(displayMode !== 'image'){
    print('block count is an image-mode setting — ascii art uncovers character by character, so it has no blocks. switch with "mode image".', 'err');
    return;
  }
  const track = imageTrack;
  if(!track.current){ print('the image collection is still loading...', 'info'); return; }
  const describe = () => {
    const per = track.cellsPerCompletion();
    const src = blockCountOverride ? 'your setting, for every image' : "this image's own pace, from the manifest";
    print(`${per} block${per === 1 ? '' : 's'} uncovered per completed task  —  ${track.tasksToFullyReveal()} tasks to fully reveal "${track.current.name}"  (${src})`);
  };
  if(!arg){ describe(); return; }

  arg = arg.toLowerCase();
  let next;
  if(/^(auto|reset|off|manifest|default)$/.test(arg)) next = null;
  else if(/^\d+$/.test(arg) && +arg >= 1) next = Math.min(BLOCK_COUNT_MAX, +arg);
  else { print(`usage: block count <1-${BLOCK_COUNT_MAX}> | auto`, 'err'); return; }
  if(/^\d+$/.test(arg) && +arg > BLOCK_COUNT_MAX){
    print(`capped at ${BLOCK_COUNT_MAX} — past that one task clears too much of the image at once`, 'info');
  }

  blockCountOverride = next;
  saveState(); renderPanel();
  print(next ? `block count set: ${next} block${next === 1 ? '' : 's'} per completed task` : "block count back to each image's own pace", 'ok');
  describe();
}

async function cmd_close(){
  const track = activeTrack();
  if(!track.pending){ print('nothing to close right now', 'err'); return; }
  const finished = await track.closePending();
  print(`closed "${finished.name}" — added to your collection. now revealing "${track.current.name}".`, 'ok');
  const spent = await track.applyBanked(art => printCompletionPrompt(art));
  if(spent) print(`...and spent ${spent} banked completion${spent === 1 ? '' : 's'} on it right away.`, 'ok');
  saveState(); renderPanel();
}

async function cmd_download(){
  const track = activeTrack();
  if(!track.pending){ print('nothing to download right now', 'err'); return; }
  const art = track.current;
  try{
    if(displayMode === 'image'){
      // a direct <a download> to the file's own path, not a fetch()+blob round trip —
      // fetch() of a local file is blocked outright when this page is opened via
      // file:// (see art-data.js), but the browser's native download of a
      // same-origin/local resource works either way.
      const ext = art.file.split('.').pop();
      const a = document.createElement('a');
      a.href = 'image_art/' + art.file;
      a.download = `${slugify(art.name)}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } else {
      const blob = new Blob([art.rows.join('\n')], { type:'text/plain' });
      triggerDownload(blob, `${slugify(art.name)}.txt`);
    }
    print(`downloading "${art.name}"... type "close" when you're ready for a new one.`, 'ok');
  }catch(e){
    print('could not download the file', 'err');
  }
}

function cmd_gallery(sub, ...rest){
  sub = (sub || 'list').toLowerCase();
  if(sub === 'list'){
    const all = [
      ...asciiTrack.collected.map(c => ({ ...c, type:'ascii' })),
      ...imageTrack.collected.map(c => ({ ...c, type:'image' })),
    ].sort((a,b) => a.collectedAt - b.collectedAt);
    if(all.length === 0){ print('no artworks collected yet — keep completing tasks!', 'info'); return; }
    all.forEach((c, i) => print(`${i+1}. [${c.type}] ${c.name}  (collected ${new Date(c.collectedAt).toLocaleDateString()})`));
    return;
  }
  if(sub === 'show'){
    const name = rest.join(' ');
    if(!name){ print('usage: gallery show <name>', 'err'); return; }
    const inAscii = asciiTrack.collected.some(c => c.name.toLowerCase() === name.toLowerCase());
    const inImage = imageTrack.collected.some(c => c.name.toLowerCase() === name.toLowerCase());
    if(!inAscii && !inImage){ print(`"${name}" isn't in your collection yet`, 'err'); return; }
    if(inAscii){
      const entry = asciiTrack.manifest && asciiTrack.manifest.artworks.find(a => a.name.toLowerCase() === name.toLowerCase());
      if(!entry){ print(`no artwork data found for "${name}"`, 'err'); return; }
      loadArtworkFile(entry).then(art => {
        print(`— ${art.name} —`);
        const pre = document.createElement('pre');
        pre.className = 'gallery-pre';
        pre.textContent = art.rows.join('\n');
        const stick = isNearOutputBottom();
        outputEl.appendChild(pre);
        if(stick) outputEl.scrollTop = outputEl.scrollHeight;
        trimOutput();
      });
    } else {
      const entry = imageTrack.manifest && imageTrack.manifest.images.find(a => a.name.toLowerCase() === name.toLowerCase());
      if(!entry){ print(`no image data found for "${name}"`, 'err'); return; }
      print(`— ${entry.name} —`);
      const img = document.createElement('img');
      img.className = 'gallery-img';
      img.src = 'image_art/' + entry.file;
      img.alt = entry.name;
      const stick = isNearOutputBottom();
      outputEl.appendChild(img);
      if(stick) outputEl.scrollTop = outputEl.scrollHeight;
      trimOutput();
    }
    return;
  }
  print('usage: gallery [list|show <name>]', 'err');
}

// commands that can change saved state. each one gets a snapshot taken before it
// runs, kept only if the state actually ended up different (pushUndo checks). view
// preferences (mode/split/switch) are deliberately left out — they're one keystroke
// to reverse, and cluttering the undo stack with them would bury the real mistakes.
// listed by canonical name only — aliases are resolved away before this is consulted.
const MUTATING = new Set(['add','rename','start','done','rm','priority','due','tag','project','import','recover','close','next','reveal','hide','block','archive','restore']);

async function handleCommand(raw){
  const trimmed = raw.trim();

  // a pending confirmation owns the next line you type, but only if that line
  // actually looks like an answer to it. the undo snapshot is taken here rather
  // than when the question was asked, since that's the moment anything actually
  // changes.
  if(pendingConfirm){
    const { label, run } = pendingConfirm;
    pendingConfirm = null;
    if(/^(y|yes)$/i.test(trimmed)){
      const before = JSON.stringify(buildStateSnapshot());
      await run();
      pushUndo(label, before);
      return;
    }
    print('cancelled — nothing changed.', 'info');
    if(trimmed === '' || /^(n|no)$/i.test(trimmed)) return;
    // anything else typed here wasn't an answer at all — it's the next thing you
    // meant to do (type "rm all", get distracted, type "add buy milk"). running it
    // instead of discarding it is what stops that add from silently vanishing into
    // the "cancelled" line above.
    return handleCommand(raw);
  }

  const tokens = tokenize(trimmed);
  if(tokens.length === 0) return;
  // aliases collapse to the real command name here, before the undo bookkeeping and
  // dispatch below — so "d 3", "done 3" and a future rename all take one path.
  const cmd = resolveAlias(tokens[0].toLowerCase());
  const rest = tokens.slice(1);

  const before = MUTATING.has(cmd) ? JSON.stringify(buildStateSnapshot()) : null;
  await dispatch(cmd, rest);
  // if the command ended by *asking* something, it hasn't changed anything yet —
  // its snapshot gets taken above when the answer arrives.
  if(before !== null && !pendingConfirm) pushUndo(trimmed, before);
}

function dispatch(cmd, rest){
  switch(cmd){
    case 'help': cmd_help(rest[0]); break;
    case 'add': cmd_add(parseFlags(rest)); break;
    case 'rename': cmd_rename(rest[0], rest.slice(1).join(' ')); break;
    case 'start': cmd_start(rest[0]); break;
    case 'done': return cmd_done(rest[0]);
    case 'rm': cmd_rm(rest[0]); break;
    case 'priority': cmd_priority(rest[0], rest[1]); break;
    case 'due': cmd_due(rest[0], rest[1]); break;
    case 'tag': cmd_tag(rest[0], rest[1], rest[2]); break;
    case 'tags': cmd_tags(); break;
    case 'project': cmd_project(rest[0], ...rest.slice(1)); break;
    case 'projects': cmd_project('list'); break;
    case 'list': cmd_list(rest); break;
    case 'filter': cmd_filter(rest); break;
    case 'archive': cmd_archive(...rest); break;
    case 'restore': cmd_restore(rest[0]); break;
    case 'find': cmd_find(rest); break;
    case 'gallery': cmd_gallery(rest[0], ...rest.slice(1)); break;
    case 'mode': cmd_mode(rest[0]); break;
    case 'folders': cmd_folders(rest); break;
    case 'include': cmd_include(rest); break;
    case 'exclude': cmd_exclude(rest); break;
    case 'view': cmd_view(rest[0]); break;
    case 'split': cmd_split(rest[0]); break;
    case 'set': cmd_set(rest[0], rest[1]); break;
    case 'theme': cmd_theme(rest[0]); break;
    // the four display toggles "set" absorbed. they rewrite into it rather than
    // having their own implementations, so there's one code path per setting —
    // the same rule the SHORTCUTS map follows. bare "mirror" keeps toggling, which
    // is what it always did and what "set mirror toggle" now spells explicitly.
    case 'title': cmd_set('title', rest[0]); break;
    case 'statline': cmd_set('statline', rest[0]); break;
    case 'mirror': cmd_set('mirror', rest[0] || 'toggle'); break;
    case 'show':
      if((rest[0] || '').toLowerCase() !== 'age'){ print('usage: show age on|off   (or: set age on|off)', 'err'); break; }
      cmd_set('age', rest[1]);
      break;
    case 'art': cmd_art(); break;
    case 'next': return cmd_next();
    case 'reveal': return cmd_reveal();
    case 'hide': cmd_hide(); break;
    case 'block': return cmd_block(rest[0], rest.slice(1));
    case 'close': return cmd_close();
    case 'undo': return cmd_undo();
    case 'download': return cmd_download();
    case 'display': cmd_display(); break;
    case 'fullscreen': cmd_fullscreen(rest[0]); break;
    case 'stats': cmd_stats(); break;
    case 'streak': cmd_streak(); break;
    case 'export': cmd_export(); break;
    case 'import': cmd_import(); break;
    case 'recover': cmd_recover(rest[0]); break;
    case 'clear': outputEl.innerHTML = ''; break;
    default: {
      const guess = suggestCommand(cmd);
      print(`unknown command "${cmd}"${guess ? ` — did you mean "${guess}"?` : ''}`, 'err');
      if(!guess) print('  try "help" for the command groups', 'info');
      break;
    }
  }
}

// ---------- input wiring ----------
const cmdInput = document.getElementById('cmd');
// echoes + runs a line exactly as if it had been typed and Enter pressed —
// shared by the real Enter handler and the list pane's [id]-bracket click
// shortcut (see below), so a click-triggered "done 3" leaves the same echo and
// history entry a typed one would, rather than a second, silent code path.
function runCommandLine(val){
  if(val.trim() === '') return;
  printEcho(val);
  pushCmdHistory(val);
  handleCommand(val).catch(err => print(`something went wrong: ${err.message}`, 'err'));
}
// tracks an in-progress Tab cycle: `applied` is the exact value this last wrote
// into the box, and repeated Tabs only advance the cycle while the box still
// holds it — type anything at all and the next Tab starts a fresh completion
// against the new text instead of continuing a stale candidate list.
let completionState = null;
function applyCompletion(){
  const { base, candidates, idx } = completionState;
  completionState.applied = base + candidates[idx];
  cmdInput.value = completionState.applied;
}
function handleTab(){
  if(completionState && cmdInput.value === completionState.applied){
    completionState.idx = (completionState.idx + 1) % completionState.candidates.length;
    applyCompletion();
    return;
  }
  const { base, candidates } = computeCompletion(cmdInput.value);
  if(candidates.length === 0){ completionState = null; return; }
  completionState = { base, candidates, idx: 0, applied: null };
  applyCompletion();
  // an unambiguous completion finishes the word and moves on: the trailing space
  // means the very next Tab completes the *next* argument rather than re-offering
  // the one just settled. dropping the state is what lets that happen.
  if(candidates.length === 1){
    cmdInput.value += ' ';
    completionState = null;
  }
}
// Up/Down search cmdHistory by the prefix you'd already typed when you first
// pressed Up, not just walk it linearly — type "do", press Up, and only past
// commands starting with "do" come back. `historyWalk` is captured on the first
// Up of a sequence (prefix + the matching entries, most-recent-first) and just
// advances on every Up/Down after that; any other key drops it (see below), so
// the next Up starts a fresh search against whatever's typed by then — the same
// behavior a real shell's Up arrow has.
function historyUp(){
  if(!historyWalk){
    const prefix = cmdInput.value;
    const matches = cmdHistory.filter(c => c.startsWith(prefix)).reverse();
    if(matches.length === 0) return;
    historyWalk = { prefix, matches, idx: 0 };
  } else if(historyWalk.idx < historyWalk.matches.length - 1){
    historyWalk.idx++;
  } else {
    return;   // already at the oldest match — nothing further back to show
  }
  cmdInput.value = historyWalk.matches[historyWalk.idx];
  cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
}
function historyDown(){
  if(!historyWalk) return;
  if(historyWalk.idx === 0){
    cmdInput.value = historyWalk.prefix;                 // walked back down past the newest match — restore what you'd typed
    historyWalk = null;
  } else {
    historyWalk.idx--;
    cmdInput.value = historyWalk.matches[historyWalk.idx];
  }
  cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
}
cmdInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Tab'){
    e.preventDefault();                                  // Tab would otherwise move focus out of the input
    handleTab();
    historyWalk = null;                                  // Tab isn't history navigation — a suspended search shouldn't outlive it
    return;
  }
  completionState = null;                                // any other key invalidates the completion cycle
  if(e.key === 'ArrowUp'){
    historyUp();
    e.preventDefault();
  } else if(e.key === 'ArrowDown'){
    historyDown();
    e.preventDefault();
  } else {
    historyWalk = null;                                  // typing (or Enter) invalidates the history-search cycle
    if(e.key === 'Enter'){
      runCommandLine(cmdInput.value);
      cmdInput.value = '';
    }
  }
});
// a plain click should refocus the input, but a drag-select shouldn't lose its
// selection the moment the mouse comes up — isCollapsed is false only when text
// is actually selected, so that's the one case this backs off.
document.body.addEventListener('click', ()=> { if(window.getSelection().isCollapsed) cmdInput.focus(); });

// ---------- clicking a row in the list pane ----------
// inserts at the caret rather than always appending to the end, so clicking a row
// while you're editing mid-command lands the id where you're actually typing.
// continues an id list rather than starting a new argument whenever the caret
// sits right after a digit — that's what turns "done " + click + click into
// "done 3,7" instead of "done 3 7" (which splitIds doesn't accept) or "done 37".
function insertIdAtCaret(id){
  const val = cmdInput.value;
  const pos = cmdInput.selectionStart != null ? cmdInput.selectionStart : val.length;
  const before = val.slice(0, pos), after = val.slice(pos);
  let insert = String(id);
  if(/\d$/.test(before)) insert = ',' + insert;
  else if(before && !/\s$/.test(before)) insert = ' ' + insert;
  cmdInput.value = before + insert + after;
  cmdInput.focus();
  cmdInput.setSelectionRange(pos + insert.length, pos + insert.length);
}
document.getElementById('list-pane').addEventListener('click', (e) => {
  // a drag-select ending on a row is copying a title, not clicking it — same
  // guard the terminal's own click-to-refocus handler uses just above.
  if(!window.getSelection().isCollapsed) return;
  const row = e.target.closest('.line[data-id]');
  if(!row) return;
  const id = row.getAttribute('data-id');
  if(e.target.closest('.row-id')){
    // pre-fills the command, doesn't run it — clicking a task is not the same
    // as deciding it's done. replaces the input outright rather than inserting,
    // since "done <id>" is a complete, ready-to-edit command on its own, not
    // something to build up the way plain row clicks accumulate ids.
    cmdInput.value = `done ${id}`;
    cmdInput.focus();
    cmdInput.setSelectionRange(cmdInput.value.length, cmdInput.value.length);
  } else {
    insertIdAtCaret(id);
  }
});

// ---------- resize dividers ----------
// both positions are kept as a percentage rather than pixels, so they hold their
// proportions when the window resizes, and both are saved with the rest of the
// state so the layout you set is the layout you get back next time.
function wireDivider(el, axis, onDrag){
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();                                  // don't start a text selection while dragging
    el.setPointerCapture(e.pointerId);                   // keep receiving moves even when the cursor outruns the 7px divider
    document.body.classList.add('dragging', `dragging-${axis}`);
    const onMove = (ev) => onDrag(ev);
    const onEnd = () => {
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onEnd);
      el.removeEventListener('pointercancel', onEnd);
      document.body.classList.remove('dragging', `dragging-${axis}`);
      saveState();
    };
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onEnd);
    el.addEventListener('pointercancel', onEnd);
  });
}

// the horizontal one: trades height between the stacked panel and the console,
// measured down from the top of the left column. whichever panel is stacked in the
// current view is the one being resized, so this reads the slot, not a fixed id.
wireDivider(document.getElementById('split-divider'), 'row', (ev) => {
  const rect = document.getElementById('term-wrap').getBoundingClientRect();
  const pane = document.querySelector('.slot-stacked');
  if(!rect.height || !pane) return;
  splitRatio = Math.min(SPLIT_MAX, Math.max(SPLIT_MIN, ((ev.clientY - rect.top) / rect.height) * 100));
  pane.style.flex = `0 0 ${splitRatio}%`;
});

// the vertical one: trades width between the console column and the side panel, in
// either view — it's the side panel's width being set, so the measurement runs
// inward from whichever edge that panel is against, which mirroring flips. writes
// to whichever ratio belongs to the current view, so dragging one view's divider
// never disturbs the other's.
wireDivider(document.getElementById('col-divider'), 'col', (ev) => {
  const rect = document.getElementById('main').getBoundingClientRect();
  const pane = document.querySelector('.slot-side');
  if(!rect.width || !pane) return;
  const span = mirrored ? ev.clientX - rect.left : rect.right - ev.clientX;
  const pct = Math.min(SIDE_MAX, Math.max(SIDE_MIN, (span / rect.width) * 100));
  if(viewMode === 'tasks') taskPaneRatio = pct; else artPaneRatio = pct;
  pane.style.flex = `0 0 ${pct}%`;
});

// ---------- boot ----------
cmdHistory = loadCmdHistory();                            // outside STORAGE_KEY (see HISTORY_KEY) — restored ahead of loadState()'s own load, not part of it
print('welcome to Momentum. type "help" to see what you can do.', 'info');
loadState();
</script>
</body>
