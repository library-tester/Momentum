<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Momentum - yet another task manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="art-data.js"></script>
<style>
  /* Each theme below is built on one accent hue plus a red, and nothing else.
     --amber is the signature (prompt, headings, and the ascii art itself) and
     --accent is the same hue a step lighter, for "ok" lines — so confirmations
     read as brighter rather than as a second colour. --error is the one place a
     different hue is allowed, because "this is wrong" has to survive being
     glanced at. Everything else is a neutral tinted toward the signature.
     Contrast was measured, not eyeballed: body text clears 7:1 against its
     background and every coloured text clears WCAG AA's 4.5:1. */

  /* "amber" — warm gold on near-black; the original look, and the fallback for
     any unrecognized data-theme value */
  :root{
    --bg-dark:     #15100c;
    --bg-panel:    #1f1811;
    --line:        #463726;
    --text-dim:    #b49d7c;
    --text-main:   #f0e5cf;
    --amber:       #d9a441;
    --accent:      #e6c079;
    --accent-dim:  #54401d;
    --error:       #d6786a;
  }
  :root[data-theme="night"]{
    --bg-dark:     #000000;
    --bg-panel:    #000000;
    --line:        #ff3333;
    --text-dim:    #ff3333;
    --text-main:   #ff3333;
    --amber:       #ff3333;
    --accent:      #ff3333;
    --accent-dim:  #ff3333;
    --error:       #ff3333;
  }
  /* "day" — mirror image of nightmode: black on white, no other color at all */
  :root[data-theme="day"]{
    --bg-dark:     #ffffff;
    --bg-panel:    #ffffff;
    --line:        #000000;
    --text-dim:    #000000;
    --text-main:   #000000;
    --amber:       #000000;
    --accent:      #000000;
    --accent-dim:  #000000;
    --error:       #000000;
  }
  /* "solar" — solarized-dark inspired. keeps solarized's iconic base03 background
     and cyan, but drops its yellow: solarized's full accent set is a rainbow, and
     one hue carries this UI fine. its greys are raised well above solarized's own
     base01/base0, which are tuned for syntax highlighting where dim text is
     genuinely decorative — here dim text carries tags and counts you have to read. */
  :root[data-theme="solar"]{
    --bg-dark:     #002b36;
    --bg-panel:    #083d4a;
    --line:        #155a6b;
    --text-dim:    #8b9c9c;
    --text-main:   #bccaca;
    --amber:       #35b5aa;
    --accent:      #6ccbc0;
    --accent-dim:  #0e4f5e;
    --error:       #dd8078;
  }
  /* "nord" — arctic blue-gray. frost blue is the signature; nord's aurora yellow is
     dropped for the same reason as solarized's. the aurora red is lightened enough
     to actually be legible on the polar-night background. */
  :root[data-theme="nord"]{
    --bg-dark:     #2a303c;
    --bg-panel:    #343b4a;
    --line:        #4c5568;
    --text-dim:    #9aa7bd;
    --text-main:   #e8ecf3;
    --amber:       #88c0d0;
    --accent:      #a8d3de;
    --accent-dim:  #3d4a5c;
    --error:       #d4818c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg-dark);
    color:var(--text-main);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:14px 20px 10px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  header .title{
    font-size:17px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--amber);
  }
  header .title span{ color:var(--accent); }
  body.no-title header .title{ display:none; }
  /* the banner's own top padding goes with it, so hiding it isn't just a blank gap */
  body.no-title header{ padding-top:8px; }
  header .stats{
    margin-top:4px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  body.no-statline header .stats{ display:none; }
  /* only one of the two lines gone still needs the header's own padding; both gone
     means nothing is left in it, so the bar (and its border) collapses entirely */
  body.no-title.no-statline header{ display:none; }
  #main{
    flex:1;
    display:flex;
    flex-direction:row;
    overflow:hidden;
    min-height:0;
  }
  /* "mirror": swap which side each column is on. row-reverse flips the visual order
     of #main's children without touching the DOM, so nothing moves between the two
     columns — the side panel and the console column just trade edges. only the
     horizontal arrangement flips; the stacked panel stays above the console. */
  body.mirrored #main{ flex-direction:row-reverse; }
  /* size (flex) and visibility (display) are not set here — they belong to whichever
     slot this panel currently occupies; see the slot rules further down. */
  #reveal-panel{
    overflow:auto;
    padding:18px 20px;
    min-width:0;
    font-size:13px;
    line-height:1.15;
    flex-direction:column;
  }
  .artwork-title{
    font-size:13px;
    color:var(--text-main);
    margin-bottom:10px;
    letter-spacing:0.5px;
    flex-shrink:0;
  }
  .artwork-progress{
    color:var(--text-dim);
    font-size:12px;
  }
  .reveal-scene{
    margin:0;
    font-family:inherit;
    font-size:13px;
    line-height:1.15;
    white-space:pre;
    flex-shrink:0;
  }
  .image-stage{
    flex:1;
    min-height:0;
    display:grid;
    place-items:start;
    overflow:hidden;
    padding:22px;
  }
  .empty-panel{
    color:var(--text-dim);
    font-size:13px;
    padding:10px 0 0;
    line-height:1.5;
  }
  .empty-panel.err{ color:var(--error); }
  .gallery-pre{
    margin:4px 0 10px;
    color:var(--amber);
    font-size:12px;
    line-height:1.1;
    white-space:pre;
  }
  .gallery-img{
    display:block;
    max-width:100%;
    margin:4px 0 10px;
  }
  .image-frame{
    position:relative;
    overflow:hidden;
    background:var(--bg-panel);
  }
  .image-base{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tile-grid{
    position:absolute;
    inset:0;
    display:grid;
  }
  .tile{
    background:var(--bg-panel);
    box-shadow: inset 0 0 0 1px var(--bg-dark);
    transition: transform .3s ease, opacity .3s ease;
  }
  .tile.revealed{
    opacity:0;
    transform:scale(0.4);
    pointer-events:none;
  }
  #fullscreen-overlay{
    position:fixed;
    inset:0;
    background:#000;
    display:grid;
    place-items:center;
    overflow:hidden;
    z-index:1000;
    cursor:pointer;
  }
  /* .image-frame/.tile normally follow the theme (var(--bg-panel)/var(--bg-dark)),
     which is the right call inside the reveal panel — but fullscreen is a themeless
     black stage by design (the overlay above is always #000, in every theme), and
     day theme's --bg-panel is white: without this, the letterboxing around the
     photo and every still-uncovered tile flash white inside what's supposed to be
     a black fullscreen frame. pinned to #000 to match the overlay exactly, not to
     var(--bg-dark), since a couple of themes (day being the extreme case) don't
     have a black to give it. */
  #fullscreen-overlay .image-frame{ background:#000; }
  #fullscreen-overlay .tile{ background:#000; box-shadow: inset 0 0 0 1px #000; }
  /* ascii keeps its real glyph size (see openAsciiFullscreen) — the grid centering
     above places it, and scaling from the centre means an oversized piece shrinks
     toward the middle instead of drifting off one edge */
  .ascii-fullscreen{
    transform-origin:center center;
    color:var(--text-main);
    font-family:'IBM Plex Mono', monospace;
  }
  .ascii-fullscreen .reveal-scene{ margin:0; text-align:left; }
  /* day is the one theme that paints its art pure black — which is invisible against
     the fullscreen overlay's black backdrop. inside the overlay only, the ascii goes
     white instead. this redefines the *custom property* rather than `color`, because
     buildArtworkScene writes an inline style="color:var(--amber)" on every character:
     an inline style beats any `color` rule, but the var() it contains still resolves
     against whatever --amber it inherits from here. the in-panel view is untouched —
     it sits on the theme's own white background, where black is correct. */
  :root[data-theme="day"] .ascii-fullscreen{
    --amber:#ffffff;
    color:#ffffff;
  }
  #term-wrap{
    flex:1 1 45%;
    display:flex;
    flex-direction:column;
    min-width:280px;
  }
  /* ---- layout slots ----
     there are two panels — the task list and the reward art — and two places to
     put them: "stacked", pinned above the console and toggled by "split", and
     "side", the full-height column beside it. the view decides which panel goes
     where: the art view keeps the art at the side and stacks the task list, the
     tasks view swaps them. applyView() moves the elements and sets these classes,
     which is what lets the sizing be written once against the slot instead of
     twice against each panel.
     flex-basis is assigned inline from the live ratio, so only grow/shrink and the
     things that don't vary live here. */
  .slot-side{ min-width:0; }
  .slot-stacked{ min-height:0; }
  #list-pane.slot-side, #list-pane.slot-stacked{ display:block; }
  #reveal-panel.slot-side, #reveal-panel.slot-stacked{ display:flex; }
  /* split off: nothing is pinned above the console, so the stacked slot and its
     divider both go away and the console has the whole left column. */
  body:not(.split) #list-pane.slot-stacked,
  body:not(.split) #reveal-panel.slot-stacked,
  body:not(.split) #split-divider{ display:none; }
  #list-pane{
    overflow-y:auto;
    padding:12px 20px;
    font-size:13px;
    line-height:1.5;
  }
  #list-pane .line{ white-space:pre-wrap; }
  #list-pane .err{ color:var(--error); }
  #list-pane .info{ color:var(--text-dim); }
  /* the list pane is the one surface in the app you look at without typing a
     command first — clicking a row inserts its id into whatever you're typing,
     and the [id] bracket pre-fills "done <id>" without running it. no hover
     styling: the pointer cursor alone is the affordance, so the pane stays as
     plain to look at as everywhere else in the app. */
  #list-pane .line.row{ cursor:pointer; }
  .pane-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    margin-bottom:6px;
    color:var(--amber);
    font-size:12px;
    letter-spacing:1px;
  }
  .pane-head span{ color:var(--text-dim); letter-spacing:0.5px; }
  /* the "this list is narrowed" badge: an outline in the same dim ink as the count
     beside it, so it reads as a condition on the list without competing with the
     task titles — which are the only thing in this pane that should be at full
     brightness. it doesn't need to shout: the count next to it already says
     "2 of 3 shown", and the two together are plenty to notice.
     (it was a filled --amber chip first, which in day theme is a solid black slab
     that drowns the pane — the same "loud accent as a fill" problem the night-mode
     scrollbar thumb has, and the same fix: outline it instead.)
     needs to out-specify ".pane-head span" above, hence the descendant selector.
     margin-right:auto keeps it next to TASKS and still pushes the count right, so
     the header stays two groups rather than three evenly-spread items. */
  .pane-head .filter-badge{
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:3px;
    padding:0 5px;
    letter-spacing:0.5px;
    margin-right:auto;
    white-space:nowrap;
  }
  /* two dividers, one per axis. #split-divider is the horizontal one inside the
     console column (stacked panel above / console below) and only exists when split
     is on. #col-divider is the vertical one between the console column and the side
     panel, and — unlike split-divider — is always there: the column boundary is
     draggable in both views, so it's also this divider's border doing the job the
     old fixed-45%-with-a-border-on-term-wrap used to do in the art view. its own
     border is symmetric (both sides), so mirroring the columns needs no extra rule
     here the way it would for a border painted on just one side. */
  #split-divider, #col-divider{
    flex:0 0 7px;
    position:relative;
    background:var(--bg-panel);
  }
  #split-divider{
    display:none;
    cursor:row-resize;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  #col-divider{
    cursor:col-resize;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  body.split #split-divider{ display:block; }
  #split-divider::after, #col-divider::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    background:var(--text-dim);
    opacity:0.55;
  }
  #split-divider::after{ width:40px; height:1px; }
  #col-divider::after{ width:1px; height:40px; }
  #split-divider:hover::after, #col-divider:hover::after{ background:var(--amber); opacity:1; }
  body.dragging{ user-select:none; }
  body.dragging-row{ cursor:row-resize; }
  body.dragging-col{ cursor:col-resize; }
  /* output + input move as one unit, so the whole console can be placed as a single
     flex item — that's what lets the tasks view put it beside the list instead of
     above it. in every other view this is just a transparent pass-through. */
  #console{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  /* "view tasks" only has to change how the console column is sized — which panel is
     on which side is handled by the slots above, not here. the column boundary is
     draggable (#col-divider) in both views now, so this just drops the fixed 45%
     basis that only ever made sense for the art view's column split. */
  body.view-tasks #term-wrap{
    flex:1 1 auto;
  }
  #output{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:12px 20px;
    font-size:13px;
    line-height:1.5;
  }
  #output .line{ white-space:pre-wrap; }
  #output .ok{ color:var(--accent); }
  #output .err{ color:var(--error); }
  #output .info{ color:var(--text-dim); }
  #output .echo{ color:var(--text-main); }
  #output .echo::before{ content:"$ "; color:var(--amber); }
  #input-row{
    display:flex;
    align-items:center;
    padding:8px 20px 14px;
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  #prompt{ color:var(--amber); margin-right:8px; font-size:13px; }
  #cmd{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-main);
    font-family:inherit;
    font-size:13px;
  }
  ::selection{ background:var(--accent-dim); }
  #output::-webkit-scrollbar, #reveal-panel::-webkit-scrollbar, #list-pane::-webkit-scrollbar{ width:8px; }
  #output::-webkit-scrollbar-thumb, #reveal-panel::-webkit-scrollbar-thumb, #list-pane::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  /* night mode's --line is pure red — filling the whole thumb with it is a slab of
     red down the side of the screen. an outline reads as the same "alert" accent
     without becoming the loudest thing in the UI: black fill, red border only. */
  :root[data-theme="night"] #output::-webkit-scrollbar-thumb,
  :root[data-theme="night"] #reveal-panel::-webkit-scrollbar-thumb,
  :root[data-theme="night"] #list-pane::-webkit-scrollbar-thumb{
    background:var(--bg-dark);
    border:1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <div class="title"><span>MOMENTUM</span></div>
  <div class="stats" id="stats">loading...</div>
</header>

<div id="main">
  <div id="term-wrap">
    <div id="list-pane" class="slot-stacked"></div>
    <div id="split-divider" title="drag to resize"></div>
    <div id="console">
      <div id="output"></div>
      <div id="input-row">
        <span id="prompt">$</span>
        <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus />
      </div>
    </div>
  </div>
  <div id="col-divider" title="drag to resize"></div>
  <div id="reveal-panel" class="slot-side"></div>
</div>

<script>
// ---------- state ----------
let tasks = [];
let archive = [];                                          // completed tasks live here, out of the normal list
let projects = [];
let cmdHistory = [];                                      // typed commands — not "history", which would shadow window.history
let historyWalk = null;                                    // in-progress Up/Down prefix search — see historyUp/historyDown
let displayMode = 'ascii';                                // 'ascii' | 'image' — which reveal track is shown on the right
const THEMES = ['amber', 'night', 'day', 'solar', 'nord'];
const THEME_ALIASES = { nightmode: 'night', daymode: 'day' };   // the original two-word switch commands still work
let theme = 'day';
let collectionLoadError = null;                          // set if ascii/image tracks failed to load — shown in the reveal panel, not just buried in the terminal log
let brokenImageStreak = 0;                                // consecutive images that failed to load, auto-skipping — see handleImageLoadError
let titleOn = true;                                      // the "MOMENTUM — yet another task manager" banner — purely cosmetic, off just reclaims a bit of vertical space
let statLineOn = true;                                   // the "N total · N completed · ..." summary line under the title
let showAge = true;                                      // the "[3d ago]" detail field, computed from createdAt — see "show age"
let excludedImageFolders = [];                           // top-level image_art/ subfolders left out of the random pool — see "exclude"/"include"
// the standing filter on the always-visible task pane — same {status, proj, tag}
// shape "list" parses its arguments into, set by "filter". a *view* preference, not
// a query: "list" stays a one-off question that answers exactly what you asked it.
const NO_FILTER = { status:'all', proj:null, tag:null };
let paneFilter = { ...NO_FILTER };
let splitOn = true;                                      // split view: task list pinned above the terminal instead of only appearing when you type "list"
let splitRatio = 38;                                     // % of the left column the list pane takes, dragged via #split-divider
const SPLIT_MIN = 12, SPLIT_MAX = 80;                    // keeps either pane from being dragged away to nothing
// 'art'   — the original layout: console left, reveal panel right (split adds the list pane above the console)
// 'tasks' — console left, task list right instead. the reward system keeps running
//           underneath either way (completions still credit reveal progress) — "art"/
//           "display" still report and show it on demand even when it's not on screen.
let viewMode = 'art';
const VIEW_MODES = ['art', 'tasks'];
// the side column's width is draggable in both views, via the same #col-divider —
// but each view keeps its own ratio, so switching views and back doesn't disturb
// whatever width you'd set for the other one.
let taskPaneRatio = 40;                                  // % of the window the task list takes in "view tasks"
let artPaneRatio = 55;                                   // % of the window the reveal panel takes in "view art" — the old fixed split, now just the default
const SIDE_MIN = 15, SIDE_MAX = 70;
let mirrored = false;                                    // flips the two columns left-for-right — see "mirror". purely which side each column is on; nothing moves between them

// how big the image reveal blocks are, set by "block size <tier>". tiers are a
// target *block count*, not a target pixel size — an earlier version measured
// blocks in source-image pixels, but that fell apart on this project's own SVG
// pieces: a viewBox-only SVG with no width/height attribute reports a tiny,
// arbitrary "natural size" (a browser fallback, often 300x150) that has nothing to
// do with how detailed the artwork actually is, so a fixed px target produced a
// near-empty grid on exactly the images it was meant to divide finely. block count
// only needs the image's *aspect ratio* to lay out square-ish blocks, and aspect
// ratio survives that fallback intact even when the absolute numbers don't.
// null means medium: leave the image on the grid its manifest entry declares,
// rather than a computed count, since manifest grids already sit in a medium-ish
// range (this project's own images run 20-40 blocks). medium isn't listed in the
// tier table below — it's the null case. full is a hard special case in
// resolveGrid (always exactly 1x1) rather than n:1 run through the usual
// square-block formula, which can drift off 1 block on a skewed aspect ratio.
const BLOCK_SIZE_TIERS = {
  full:      { n: 1,   label: 'full — one block; a single completed task reveals it' },
  verybig:   { n: 4,   label: 'very big' },
  big:       { n: 10,  label: 'big' },
  small:     { n: 100, label: 'small' },
  verysmall: { n: 300, label: 'very small' },
};
let blockSizePref = { n: BLOCK_SIZE_TIERS.small.n };     // default: small. null | { n: <target block count> }
const GRID_MAX_CELLS = 2500;                             // one <div> per block; past this the DOM cost stops being free
const GRID_MAX_SIDE = 100;

// how many blocks one completed task uncovers, set by "block count <n>". direct,
// not derived from a piece's declared revealTasks — set once, it holds for every
// image regardless of how many blocks that image has. null = leave each piece on
// its own manifest pace.
const BLOCK_COUNT_MAX = 20;
let blockCountOverride = 10;                             // default: 10 blocks per completed task

function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
}

// each panel is on screen in two of the four (view x split) combinations: the one
// where it's the side panel, plus the one where split pins it above the console.
// everything that needs to know "is this thing actually visible right now" asks
// here rather than testing splitOn, which is only ever half the answer.
function listPaneVisible(){ return viewMode === 'tasks' || splitOn; }
function revealPaneVisible(){ return viewMode === 'art' || splitOn; }

// puts the two panels in their slots for the current view and sizes them. the art
// view keeps the reward art at the side and stacks the task list above the console;
// the tasks view swaps the pair, so whichever panel isn't the headline is the one
// "split" pins above the prompt. one panel is never in both places at once —
// they're single elements that get moved, not duplicated.
function applyView(){
  const tasksView = viewMode === 'tasks';
  const listPane = document.getElementById('list-pane');
  const revealPane = document.getElementById('reveal-panel');
  const stacked = tasksView ? revealPane : listPane;
  const side    = tasksView ? listPane   : revealPane;

  document.body.classList.toggle('view-tasks', tasksView);
  document.body.classList.toggle('split', splitOn);
  document.body.classList.toggle('mirrored', mirrored);

  // only move a panel when it's actually in the wrong place: re-parenting tears
  // down and rebuilds an element's rendering, which would restart the tile fade
  // transitions on every unrelated render.
  const wrap = document.getElementById('term-wrap');
  const main = document.getElementById('main');
  if(wrap.firstElementChild !== stacked) wrap.insertBefore(stacked, wrap.firstElementChild);
  if(main.lastElementChild !== side) main.appendChild(side);

  stacked.classList.add('slot-stacked'); stacked.classList.remove('slot-side');
  side.classList.add('slot-side'); side.classList.remove('slot-stacked');

  stacked.style.flex = `0 0 ${splitRatio}%`;
  side.style.flex = `0 0 ${tasksView ? taskPaneRatio : artPaneRatio}%`;

  if(listPaneVisible()) renderListPane();
}

function applyTitle(){
  document.body.classList.toggle('no-title', !titleOn);
}

function applyStatLine(){
  document.body.classList.toggle('no-statline', !statLineOn);
}

const STORAGE_KEY = 'momentum-tasks-v1';
const LEGACY_STORAGE_KEY = 'garden-tasks-v1';  // fall back to pre-rename saves so existing task lists aren't lost
// four small keys, separate from STORAGE_KEY on purpose: none of this is app data,
// so none of it belongs in what "undo"/"import"/"export" read or write.
const AUTOBACKUP_KEY = 'momentum-autobackup-v1';    // rolling history — see pushAutoBackup/cmd_recover
const LAST_EXPORT_KEY = 'momentum-last-export-v1';  // for the "you haven't exported in a while" nudge
const FIRST_SEEN_KEY = 'momentum-first-seen-v1';    // that nudge's fallback baseline if you've never exported at all
const HISTORY_KEY = 'momentum-history-v1';          // typed-command history — see cmdHistory below

function isOverdue(t){
  if(!t.due || t.status === 'done') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(t.due + 'T00:00:00');
  return d < today;
}

// calendar-day key in local time — the unit both the streak and the heatmap
// group completions by, so two completions on the same day (regardless of
// time of day) always land in the same bucket.
function localDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// relative age since createdAt, for the "[3d ago]" detail field (see "show age").
// coarsens as it goes further back — a task doesn't need day-level precision once
// it's months old, and staying coarse keeps the detail line from getting noisy.
function taskAgeText(createdAt){
  const days = Math.floor((Date.now() - createdAt) / 86400000);
  if(days <= 0) return 'today';
  if(days === 1) return '1d ago';
  if(days < 30) return `${days}d ago`;
  const months = Math.floor(days / 30);
  if(months < 12) return `${months}mo ago`;
  return `${Math.floor(days / 365)}y ago`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// small, fast, deterministic PRNG (mulberry32) — doesn't need to be cryptographic,
// it exists purely so a reveal order can be reproduced from one saved integer
// instead of the whole shuffled array (see materializeOrder below). same
// Fisher-Yates as shuffledIndices above, just drawing from this instead of
// Math.random() so the same seed always reshuffles the same way.
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffledIndices(seed, n){
  const rand = mulberry32(seed);
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// a fresh 32-bit seed for a newly-started piece — one Math.random() call, versus
// the array of up to GRID_MAX_CELLS numbers it replaces in storage.
function randomSeed(){
  return (Math.random() * 0xFFFFFFFF) >>> 0;
}
// progress.order is the authority whenever it's set — that only happens after a
// regrid (see remapReveal), whose coverage-weighted reordering depends on the
// old revealed region and can't be reconstructed from a formula. absent that,
// the order is generated fresh from progress.seed every time it's needed: a
// seeded shuffle of range(total) is fully determined by (seed, total), so a
// piece that's never been regridded doesn't need its shuffle order stored at
// all — just the one number that reproduces it.
function materializeOrder(progress, total){
  return progress.order || seededShuffledIndices(progress.seed, total);
}

// ---------- folder discovery ----------
// lets new files just work by dropping them into ascii_art/ or image_art/ and
// reloading — no manifest.json edit required. relies on the dev server exposing
// a plain directory listing (an <a href> per entry) at each folder URL, which
// `python3 -m http.server` (this project's usual dev server) does automatically.
// manifest.json becomes optional, per-file *override* data: if an entry there
// matches a discovered file's path, its fields (name/category/revealTasks/grid/
// id) win over the auto-derived defaults, so existing curation keeps working.
// hosts that don't expose directory listings (most production static hosts)
// simply fail the discovery fetch, and loadManifest() falls back to reading
// manifest.json as a plain, complete list, exactly as before.
//
// none of this works when the page is opened directly as a file:// URL —
// browsers refuse fetch()/XHR against local files entirely, for both the
// directory listing and manifest.json itself. art-data.js (see art-data.js
// header + build_art_data.py) is a pre-baked snapshot of exactly what
// discovery would have produced, loaded as a plain <script> tag instead of
// fetched, which file:// pages *are* allowed to do. loadManifest() below
// still tries live discovery first (so serving over http keeps auto-picking
// up new files with zero build step, per the comment above), and only falls
// back to that snapshot when discovery fails — which is always, under
// file://. opening the html file directly needs one command first, whenever
// ascii_art/ or image_art/ have changed: python3 build_art_data.py
//
// forgetting that step is easy to miss, because it never breaks anything while
// you're serving the app — only the *next* time it's opened as file://, quietly
// showing the old set with no error. detectStaleSnapshot() below closes that gap:
// whenever live discovery does succeed, it's compared against art-data.js right
// there, and loadState() prints a gentle note if discovery found files the
// snapshot has never heard of.
function humanizeName(stem){
  const words = stem.split(/[-_\s]+/).filter(Boolean);
  if(!words.length) return stem;
  return words.map(w => (w === w.toUpperCase() && /[A-Z]/.test(w)) ? w : w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}
async function fetchDirListing(url){
  const res = await fetch(url);
  if(!res.ok || !(res.headers.get('content-type') || '').includes('text')) throw new Error('no directory listing at ' + url);
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  return Array.from(doc.querySelectorAll('a[href]'))
    .map(a => a.getAttribute('href'))
    .filter(href => href && !href.startsWith('?') && !href.includes('://'));
}
// directory-listing HTML isn't standardized and formats vary a lot between dev
// servers: python's http.server emits relative hrefs with a trailing slash on
// folders ("nature/", "manifest.json"), while servers built on "serve-index"
// (the live-server npm package, and VS Code's Live Server extension, which
// appears to use the same or a compatible listing format) emit *absolute*
// paths with *no* trailing slash on folders, plus "up"/breadcrumb links back
// to the parent folder and site root — including a bare href="/" that (like
// any folder link) ends in "/", so a naive "ends with slash = recurse into
// it" check follows it straight back to a listing containing that same "/"
// link again, forever. resolving every href against the current listing's own
// URL and only following ones that land strictly *inside* the folder this
// walk started from sidesteps the format differences entirely and can't walk
// back out toward the root; the visited set is a second backstop against any
// other kind of link cycle (e.g. a symlink loop) doing the same thing.
async function discoverFiles(baseUrl, extensions){
  const topBase = new URL(baseUrl, location.href).href;
  const visited = new Set([topBase]);
  async function walk(dirUrl){
    const hrefs = await fetchDirListing(dirUrl);
    let files = [];
    for(const href of hrefs){
      const resolved = new URL(href, dirUrl).href;
      if(!resolved.startsWith(topBase) || resolved === topBase || visited.has(resolved)) continue;
      const relPath = decodeURIComponent(resolved.slice(topBase.length)).replace(/\/$/, '');
      const isDir = href.endsWith('/') || !/\.[^./]+$/.test(relPath);
      if(isDir){
        visited.add(resolved);
        files = files.concat(await walk(resolved.endsWith('/') ? resolved : resolved + '/'));
      } else if(extensions.some(ext => relPath.toLowerCase().endsWith(ext))){
        files.push(relPath);
      }
    }
    return files;
  }
  return walk(topBase);
}
async function discoverManifest({ baseDir, extensions, manifestUrl, itemsField, defaultExtra }){
  const files = await discoverFiles(baseDir, extensions);
  if(files.length === 0) throw new Error('discovery found nothing at ' + baseDir);   // probably not a real listing — fall back

  let overridesByFile = {};
  try{
    const res = await fetch(manifestUrl);
    if(res.ok){
      (((await res.json())[itemsField]) || []).forEach(e => { if(e.file) overridesByFile[e.file] = e; });
    }
  }catch(e){ /* no manifest.json (or it's unreadable) — discovered defaults stand on their own */ }

  const usedIds = new Set();
  const items = files.sort().map(file => {
    const override = overridesByFile[file] || {};
    const stem = file.slice(file.lastIndexOf('/') + 1).replace(/\.[^.]+$/, '');
    const folder = file.includes('/') ? file.slice(0, file.lastIndexOf('/')) : null;
    const baseId = override.id || slugify(stem);
    let id = baseId, n = 2;
    while(usedIds.has(id)){ id = `${baseId}-${n++}`; }
    usedIds.add(id);
    return Object.assign({ id, name: humanizeName(stem), category: folder, file, revealTasks: 6 }, defaultExtra, override, { file });
  });
  return { [itemsField]: items };
}

// compares a live-discovered file list against the pre-baked art-data.js snapshot
// for the same track, looking only for files discovery found that the snapshot has
// never heard of — the "you added art and forgot to rebuild" case (item 18). the
// reverse (a file the snapshot has but discovery didn't find, i.e. something was
// deleted) is a different, already-tracked problem — missing/broken art files —
// and not what this check is for, so it's deliberately left alone here.
function detectStaleSnapshot(discoveredItems, dataKey, itemsField){
  const baked = window.ART_DATA && window.ART_DATA[dataKey];
  if(!baked || !Array.isArray(baked[itemsField])) return null;   // no snapshot to be stale relative to
  const bakedFiles = new Set(baked[itemsField].map(e => e.file));
  const newFiles = discoveredItems.map(e => e.file).filter(f => !bakedFiles.has(f));
  return newFiles.length ? { newFiles, generatedAt: window.ART_DATA.generatedAt || null } : null;
}

// ---------- generic collectible reveal track ----------
// both the ascii-art system and the image system are the same state machine:
// load a manifest of entries, load the current entry's content, reveal a random
// handful of its cells per completed task, and once fully revealed, log it to a
// permanent gallery and start a new one (picked so nothing repeats until every
// entry in the manifest has had a turn). this factory is shared by both so a
// third mode later is just another instantiation, not a new system.
function createRevealTrack({ baseDir, extensions, manifestUrl, itemsField, dataKey, loadItem, totalCellsFor, defaultExtra, progressExtra, regrid, syncItem, perTaskOverride, filterPool }){
  return {
    manifest: null,
    current: null,                                        // loaded item, shape depends on loadItem
    progress: { itemId:null, seed:0, revealedCount:0 },
    collected: [],                                         // permanent gallery history [{id,name,collectedAt}] — never auto-cleared
    cycleSeen: [],                                         // ids picked in the current pass, so nothing repeats until everyone's had a turn
    pending: false,                                        // true once fully revealed but not yet closed/downloaded — freezes it on screen
    banked: 0,                                             // completions earned while pending, waiting to be spent on the next piece
    staleSnapshot: null,                                   // set when live discovery found files art-data.js doesn't know about — see loadManifest

    async loadManifest(){
      // live discovery first: when served over http this picks up newly dropped-in
      // files immediately, no rebuild step (see the comment above). it always fails
      // under file:// (and on static hosts with no directory listing), so falling
      // through to the art-data.js snapshot — and, failing that, a plain manifest.json
      // fetch — is the normal path in those cases, not an error case.
      try{
        this.manifest = await discoverManifest({ baseDir, extensions, manifestUrl, itemsField, defaultExtra });
        // only meaningful here, in the branch where discovery actually succeeded:
        // that's the one moment this app can see both "what's really on disk" and
        // "what art-data.js thinks is on disk" at once, so it's the only place a
        // staleness check is even possible.
        this.staleSnapshot = detectStaleSnapshot(this.manifest[itemsField], dataKey, itemsField);
        return;
      }catch(e){ /* fall through to the baked snapshot / plain manifest.json below */ }
      const baked = window.ART_DATA && window.ART_DATA[dataKey];
      if(baked && Array.isArray(baked[itemsField]) && baked[itemsField].length){
        this.manifest = { [itemsField]: baked[itemsField] };
        return;
      }
      const res = await fetch(manifestUrl);
      this.manifest = await res.json();
    },
    pickNextEntry(){
      const all = this.manifest[itemsField];
      // filterPool (image track only — see "exclude"/"include") narrows the pool
      // before the cycle logic runs, so excluded folders never get a turn. falls
      // back to the unfiltered list if that would leave nothing to pick from,
      // rather than throwing — a stale/impossible exclusion shouldn't brick the app.
      const filtered = filterPool ? filterPool(all) : all;
      const items = filtered.length ? filtered : all;
      let pool = items.filter(e => !this.cycleSeen.includes(e.id));
      if(pool.length === 0){ this.cycleSeen = []; pool = items.slice(); }
      const entry = pool[Math.floor(Math.random() * pool.length)];
      this.cycleSeen.push(entry.id);
      return entry;
    },
    async startNew(){
      const entry = this.pickNextEntry();
      this.current = await loadItem(entry);
      this.progress = Object.assign({
        itemId: this.current.id,
        seed: randomSeed(),
        revealedCount: 0,
      }, progressExtra ? progressExtra(this.current) : null);
      this.pending = false;
    },
    async init(){
      await this.loadManifest();
      const entry = this.progress.itemId && this.manifest[itemsField].find(e => e.id === this.progress.itemId);
      if(entry){
        this.current = await loadItem(entry);
        const total = totalCellsFor(this.current);
        // a mismatch is only possible when there's an explicit order (set by a past
        // regrid) whose length no longer fits — a seed alone always regenerates
        // correctly-sized for whatever `total` turns out to be, so there's nothing
        // to rescue in that case; it's self-healing by construction.
        if(Array.isArray(this.progress.order) && this.progress.order.length !== total){
          // the cell count moved under us — either the source file changed, or the
          // grid preference did (a "block size" command run in an earlier session,
          // or an import from a save made under a different one). regrid, where the
          // track knows how, keeps the picture; otherwise fall back to a fresh order.
          const rescued = regrid && regrid(this.progress, this.current, this.pending);
          if(rescued) Object.assign(this.progress, rescued);
          else { this.progress.order = null; this.progress.seed = randomSeed(); }
        } else if(!Array.isArray(this.progress.order) && !Number.isFinite(this.progress.seed)){
          // neither an explicit order nor a seed — a corrupt save, or one that
          // slipped past the migration in restore() below. same fallback.
          this.progress.seed = randomSeed();
        }
        this.progress.revealedCount = Math.min(this.progress.revealedCount || 0, total);
        return;
      }
      await this.startNew();
    },
    totalCells(){ return totalCellsFor(this.current); },
    // how many cells one completed task uncovers. perTaskOverride (image track only —
    // see "block count") is a direct value that replaces the usual derivation from
    // revealTasks entirely, so it holds steady across images with different totals
    // rather than scaling with them.
    cellsPerCompletion(){
      if(perTaskOverride && perTaskOverride()) return Math.min(perTaskOverride(), this.totalCells());
      return Math.max(1, Math.ceil(this.totalCells() / (this.current.revealTasks || 6)));
    },
    // tasks-to-fully-reveal as actually shown to the user: the piece's own declared
    // value normally, but derived from the override when one is active (revealTasks
    // itself isn't touched, so switching the override off cleanly restores the
    // manifest's number rather than whatever this last computed to).
    tasksToFullyReveal(){
      if(perTaskOverride && perTaskOverride()) return Math.ceil(this.totalCells() / this.cellsPerCompletion());
      return this.current.revealTasks;
    },
    // reveals n more cells; once full, freezes as "pending" instead of auto-advancing —
    // the caller (close/download) decides when to actually move on.
    async reveal(n, onComplete){
      if(!this.current || this.pending) return;
      const total = totalCellsFor(this.current);
      this.progress.revealedCount = Math.min(total, this.progress.revealedCount + n);
      if(this.progress.revealedCount >= total){
        this.pending = true;
        if(onComplete) onComplete(this.current);
      }
    },
    // one finished task = one completion's worth of reveal. if the current piece is
    // already fully revealed and just waiting to be closed, the credit is *banked*
    // rather than dropped on the floor: the whole promise of the app is that every
    // completed task moves the reward forward, so "done 1,2,3" that finishes the
    // piece on task 1 must still pay out for tasks 2 and 3 (see applyBanked).
    async creditCompletion(onComplete){
      if(!this.current) return 'none';
      if(this.pending){ this.banked++; return 'banked'; }
      await this.reveal(this.cellsPerCompletion(), onComplete);
      return 'revealed';
    },
    // spends the banked completions on the freshly started piece. one at a time, so
    // if the bank is deep enough to finish this piece too it stops there and the rest
    // stays banked for the one after — nothing is ever lost, just deferred.
    async applyBanked(onComplete){
      let spent = 0;
      while(this.banked > 0 && !this.pending && this.current){
        this.banked--;
        spent++;
        await this.reveal(this.cellsPerCompletion(), onComplete);
      }
      return spent;
    },
    // re-points `current` at whatever progress.itemId says, for when state is replaced
    // wholesale underneath us — undo can rewind past a "close" that switched pieces,
    // and without this the panel would draw the old artwork with the new progress.
    // the loaded item also carries settings that live in the snapshot (the reveal
    // grid, the pace), so syncItem pulls those back too: here the restored progress
    // is the authority and the item follows it. (that's the opposite of init(),
    // where a *preference* changed and the saved progress is what has to adapt —
    // different direction because a rewind must reproduce exactly what you had.)
    async resync(){
      if(!this.manifest || !this.progress.itemId) return;
      if(!this.current || this.current.id !== this.progress.itemId){
        const entry = this.manifest[itemsField].find(e => e.id === this.progress.itemId);
        if(entry) this.current = await loadItem(entry);
      }
      if(syncItem && this.current) syncItem(this.current, this.progress);
    },
    // logs the finished piece to the permanent gallery and starts a new one; returns the finished item
    async closePending(){
      if(!this.pending) return null;
      const finished = this.current;
      this.collected.push({ id: finished.id, name: finished.name, collectedAt: Date.now() });
      await this.startNew();
      return finished;
    },
    serialize(){ return { progress: this.progress, collected: this.collected, cycleSeen: this.cycleSeen, pending: this.pending, banked: this.banked }; },
    restore(data){
      if(!data) return;
      this.progress = data.progress || { itemId:null, seed:0, revealedCount:0 };
      // legacy saves (from before progress moved to a seed) stored the shuffled
      // order outright — kept as an explicit override rather than migrated into a
      // seed, so an old save's art doesn't invisibly reshuffle on its first load
      // under this version.
      if(Array.isArray(this.progress.revealOrder) && this.progress.order === undefined){
        this.progress.order = this.progress.revealOrder;
      }
      delete this.progress.revealOrder;
      this.collected = data.collected || [];
      this.cycleSeen = data.cycleSeen || [];
      this.pending = !!data.pending;
      this.banked = data.banked || 0;
    },
  };
}

// ---------- ascii-art track ----------
// artworks live as plain text files under ascii_art/, indexed by ascii_art/manifest.json,
// so new ones can be dropped in without touching this code.
async function loadArtworkFile(entry){
  const text = entry.content !== undefined ? entry.content : await (await fetch('ascii_art/' + entry.file)).text();
  const rawRows = text.replace(/\r\n/g, '\n').split('\n');
  while(rawRows.length && rawRows[rawRows.length - 1] === '') rawRows.pop();
  const width = Math.max(1, ...rawRows.map(r => r.length));
  const rows = rawRows.map(r => r.padEnd(width, ' '));
  const cellIndices = [];
  rows.forEach((row, r) => {
    for(let c = 0; c < width; c++){ if(row[c] !== ' ') cellIndices.push(r * width + c); }
  });
  return {
    id: entry.id, name: entry.name, category: entry.category,
    revealTasks: entry.revealTasks || 6,
    rows, width, height: rows.length, cellIndices,
  };
}

const asciiTrack = createRevealTrack({
  baseDir: 'ascii_art/',
  extensions: ['.txt'],
  manifestUrl: 'ascii_art/manifest.json',
  itemsField: 'artworks',
  dataKey: 'ascii',
  loadItem: loadArtworkFile,
  totalCellsFor: item => item.cellIndices.length,
});

// ---------- image track ----------
// images live under image_art/, indexed by image_art/manifest.json. each entry declares
// a reveal grid (cols x rows); completing tasks pops that many "cube" tiles off the image.

// the source file's pixel dimensions, needed to give "block size" a stable meaning —
// a target px-per-block only means the same thing across images once it's measured
// against each one's real resolution, rather than assumed from the manifest grid,
// which for auto-discovered files is just a 6x4 default that says nothing about the
// photo's shape. cached because it costs a decode, and answered with a 3:2 guess if
// the file won't load at all, so a broken image degrades to a slightly-off grid
// instead of a hang.
const DEFAULT_DIMS = { w: 900, h: 600 };
const IMAGE_DIMS_TIMEOUT = 3000;
const imageDimsCache = {};
function imageDims(file){
  if(imageDimsCache[file]) return Promise.resolve(imageDimsCache[file]);
  return new Promise(resolve => {
    const img = new Image();
    let settled = false;
    // the guess from a timeout isn't cached — a slow decode that eventually
    // succeeds should give the real numbers next time, unlike a genuine error.
    const done = (dims, cache) => { if(settled) return; settled = true; if(cache) imageDimsCache[file] = dims; resolve(dims); };
    img.onload = () => done(img.naturalWidth && img.naturalHeight
      ? { w: img.naturalWidth, h: img.naturalHeight } : DEFAULT_DIMS, true);
    img.onerror = () => done(DEFAULT_DIMS, true);
    setTimeout(() => done(DEFAULT_DIMS, false), IMAGE_DIMS_TIMEOUT);
    img.src = 'image_art/' + file;
  });
}

// a saved/imported preference is untrusted input like everything else in a restored
// snapshot — anything that isn't exactly one of the real tiers falls back to null
// ("medium" — use the manifest grid).
function sanitizeBlockSizePref(p){
  if(!p || typeof p !== 'object' || !Number.isFinite(p.n)) return null;
  return Object.values(BLOCK_SIZE_TIERS).some(t => t.n === p.n) ? { n: p.n } : null;
}

function clampGrid(cols, rows){
  cols = Math.max(1, Math.round(cols) || 1);
  rows = Math.max(1, Math.round(rows) || 1);
  // scale both axes down together first, so the shape of the grid you asked for
  // survives being cut down to size. capping each side first instead would take a
  // 400x250 request to 100x100 — square blocks turned into slabs, which is exactly
  // the thing the count/size modes exist to avoid.
  if(cols * rows > GRID_MAX_CELLS){
    const k = Math.sqrt(GRID_MAX_CELLS / (cols * rows));
    cols = Math.max(1, Math.floor(cols * k));
    rows = Math.max(1, Math.floor(rows * k));
  }
  return { cols: Math.min(GRID_MAX_SIDE, cols), rows: Math.min(GRID_MAX_SIDE, rows) };
}

// turns the stored block-size preference into a concrete grid for one specific
// image. cols is chosen so cols x rows lands as close to the target count as whole
// blocks allow, with cols/rows matching the image's real aspect ratio (so blocks
// come out square-ish rather than stretched); rows is derived from cols rather than
// rounded independently, which is what keeps the product on target.
async function resolveGrid(entry){
  const declared = entry.grid && entry.grid.cols && entry.grid.rows
    ? { cols: entry.grid.cols, rows: entry.grid.rows }
    : { cols: 6, rows: 4 };                                // manifest entry with no grid — don't crash, just use the house default
  if(!blockSizePref) return clampGrid(declared.cols, declared.rows);
  if(blockSizePref.n === 1) return { cols: 1, rows: 1 };   // "full": always exactly one block, whatever the aspect ratio
  const dims = await imageDims(entry.file);
  const aspect = (dims.w / dims.h) || 1;
  const cols = Math.max(1, Math.round(Math.sqrt(blockSizePref.n * aspect)));
  return clampGrid(cols, blockSizePref.n / cols);
}

// ---------- regridding a piece that's already part-revealed ----------
// changing the grid must not throw away what you've uncovered. the revealed area is
// treated as a *region of the image*, not as a set of tile numbers: every new block
// is scored by how much of it the old revealed region covers (exact rectangle
// intersection — both grids are regular), then the most-covered blocks are the ones
// that come up revealed. so the picture you're looking at stays the picture you're
// looking at; only the resolution of the mask changes.
//
// how many blocks end up revealed is set by area, not by count: the revealed
// *fraction* is preserved and rounded to the nearest whole block of the new grid.
// two guards on that rounding:
//   - progress that rounds down to zero is kept at one block. this app's one
//     inviolable rule is that earned reveal never silently vanishes (see the banked-
//     completions logic above), and "you regridded and your 2% disappeared" is that
//     same leak wearing a different hat.
//   - a piece that wasn't finished can't come out finished. completing a piece is
//     something tasks do; a display setting rounding up to 100% would hand out a
//     gallery entry nobody earned. it stops one block short instead.
// takes the OLD order already materialized (see materializeOrder) rather than a
// progress object, so this doesn't care whether that order came from a stored
// seed or an earlier explicit override — either way the caller hands over a
// plain array and this produces a new one, since a coverage-weighted remap
// depends on the specific old revealed region and can't be re-derived from a
// formula the way a fresh shuffle can.
function remapReveal(oldOrder, oldRevealedCount, from, to, wasComplete){
  const oldTotal = from.cols * from.rows, newTotal = to.cols * to.rows;
  const revealedOld = new Set(oldOrder.slice(0, oldRevealedCount));

  const coverage = new Array(newTotal).fill(0);
  for(let nr = 0; nr < to.rows; nr++){
    const y0 = nr / to.rows, y1 = (nr + 1) / to.rows;
    // only the old rows this new row actually touches
    const r0 = Math.floor(y0 * from.rows), r1 = Math.min(from.rows - 1, Math.ceil(y1 * from.rows) - 1);
    for(let nc = 0; nc < to.cols; nc++){
      const x0 = nc / to.cols, x1 = (nc + 1) / to.cols;
      const c0 = Math.floor(x0 * from.cols), c1 = Math.min(from.cols - 1, Math.ceil(x1 * from.cols) - 1);
      let covered = 0;
      for(let orr = r0; orr <= r1; orr++){
        const oy0 = orr / from.rows, oy1 = (orr + 1) / from.rows;
        const oh = Math.min(y1, oy1) - Math.max(y0, oy0);
        if(oh <= 0) continue;
        for(let oc = c0; oc <= c1; oc++){
          if(!revealedOld.has(orr * from.cols + oc)) continue;
          const ox0 = oc / from.cols, ox1 = (oc + 1) / from.cols;
          const ow = Math.min(x1, ox1) - Math.max(x0, ox0);
          if(ow > 0) covered += ow * oh;
        }
      }
      coverage[nr * to.cols + nc] = covered * newTotal;    // as a fraction of one new block
    }
  }

  const fraction = oldTotal ? oldRevealedCount / oldTotal : 0;
  let keep = Math.round(fraction * newTotal);
  if(oldRevealedCount > 0 && keep < 1) keep = 1;
  if(!wasComplete && keep >= newTotal) keep = newTotal - 1;
  if(wasComplete) keep = newTotal;
  keep = Math.min(newTotal, Math.max(0, keep));

  // most-covered blocks first so the revealed region lands where it was; the random
  // tiebreak keeps equally-covered blocks (and the whole untouched remainder) from
  // uncovering in a readable left-to-right sweep later on. this result is a
  // coverage-weighted reordering, not a plain shuffle, so — unlike a fresh piece's
  // order — it has to be stored explicitly; `order` (not `seed`) is what carries it.
  const order = shuffledIndices(newTotal).sort((a, b) => coverage[b] - coverage[a]);
  return { order, revealedCount: keep, grid: { cols: to.cols, rows: to.rows } };
}

async function loadImageEntry(entry){
  const grid = await resolveGrid(entry);
  return {
    id: entry.id, name: entry.name, category: entry.category, file: entry.file,
    cols: grid.cols, rows: grid.rows,
    declaredGrid: entry.grid && entry.grid.cols ? { cols: entry.grid.cols, rows: entry.grid.rows } : { cols: 6, rows: 4 },
    revealTasks: entry.revealTasks || 6,
  };
}

// the top-level image_art/ subfolder a manifest entry lives in — read straight
// from "file" rather than "category", since category can be (and in this
// project's own manifest.json, is) overridden away from the real folder; the
// "exclude"/"include" commands are about physical folders, so they need the
// one field discovery never lets drift from disk.
function imageFolderOf(entry){
  return (entry && entry.file && entry.file.includes('/')) ? entry.file.split('/')[0] : '(root)';
}

const imageTrack = createRevealTrack({
  baseDir: 'image_art/',
  extensions: ['.png', '.jpg', '.jpeg', '.svg', '.webp', '.gif'],
  manifestUrl: 'image_art/manifest.json',
  itemsField: 'images',
  dataKey: 'image',
  loadItem: loadImageEntry,
  totalCellsFor: item => item.cols * item.rows,
  defaultExtra: { grid: { cols: 6, rows: 4 } },
  filterPool: items => items.filter(e => !excludedImageFolders.includes(imageFolderOf(e))),
  // the grid each saved reveal order was numbered against — without it, a reload
  // under a changed grid preference has no way to know where the revealed blocks were.
  progressExtra: item => ({ grid: { cols: item.cols, rows: item.rows } }),
  regrid: (progress, item, pending) => (progress.grid && progress.grid.cols)
    ? remapReveal(
        materializeOrder(progress, progress.grid.cols * progress.grid.rows),
        progress.revealedCount, progress.grid, { cols: item.cols, rows: item.rows }, pending)
    : null,
  syncItem: (item, progress) => {
    if(progress.grid && progress.grid.cols){ item.cols = progress.grid.cols; item.rows = progress.grid.rows; }
  },
  perTaskOverride: () => blockCountOverride,
});

function activeTrack(){ return displayMode === 'image' ? imageTrack : asciiTrack; }

// shared between saveState (-> localStorage) and cmd_export (-> downloadable file),
// so "back up your tasks" is always exactly what "restore your tasks" expects.
function buildStateSnapshot(){
  return {
    tasks, archive, projects, displayMode, theme, splitOn, splitRatio, titleOn, statLineOn, showAge,
    blockSizePref, blockCountOverride, excludedImageFolders, viewMode, taskPaneRatio, artPaneRatio, mirrored, paneFilter,
    ascii: asciiTrack.serialize(), image: imageTrack.serialize(),
  };
}
// shared between loadState (localStorage) and cmd_import (a backup file) — same
// shape either way, so importing a file behaves exactly like a fresh page load.
function applyStateSnapshot(data){
  tasks = data.tasks || [];
  archive = data.archive || [];
  projects = data.projects || [];
  displayMode = data.displayMode === 'image' ? 'image' : 'ascii';
  theme = THEMES.includes(data.theme) ? data.theme : (data.nightMode ? 'night' : 'day');   // data.nightMode: pre-multi-theme saves
  splitOn = data.splitOn === undefined ? true : !!data.splitOn;   // undefined: a save from before split defaulted on
  splitRatio = Number.isFinite(data.splitRatio) ? Math.min(SPLIT_MAX, Math.max(SPLIT_MIN, data.splitRatio)) : 38;
  titleOn = data.titleOn === undefined ? true : !!data.titleOn;   // undefined: a save from before this setting existed, when the title was always on
  statLineOn = data.statLineOn === undefined ? true : !!data.statLineOn;   // same reasoning as titleOn
  showAge = data.showAge === undefined ? true : !!data.showAge;   // same reasoning as titleOn
  excludedImageFolders = Array.isArray(data.excludedImageFolders) ? data.excludedImageFolders : [];
  // rebuilt field by field rather than trusted wholesale: a saved filter is the one
  // setting that can hide your tasks, so a malformed one has to fail open (show
  // everything) instead of leaving the pane mysteriously empty.
  paneFilter = data.paneFilter && !listArgsError(data.paneFilter)
    ? { status: data.paneFilter.status, proj: data.paneFilter.proj || null, tag: data.paneFilter.tag || null }
    : { ...NO_FILTER };
  viewMode = VIEW_MODES.includes(data.viewMode) ? data.viewMode : 'art';   // undefined: a save from before the tasks view existed
  taskPaneRatio = Number.isFinite(data.taskPaneRatio) ? Math.min(SIDE_MAX, Math.max(SIDE_MIN, data.taskPaneRatio)) : 40;
  artPaneRatio = Number.isFinite(data.artPaneRatio) ? Math.min(SIDE_MAX, Math.max(SIDE_MIN, data.artPaneRatio)) : 55;   // undefined: a save from before the art column was draggable
  mirrored = !!data.mirrored;                                              // undefined: a save from before mirroring existed — unmirrored, as it looked then
  blockSizePref = sanitizeBlockSizePref(data.blockSizePref);
  blockCountOverride = Number.isFinite(data.blockCountOverride) && data.blockCountOverride > 0
    ? Math.min(BLOCK_COUNT_MAX, Math.round(data.blockCountOverride)) : null;
  asciiTrack.restore(data.ascii);
  imageTrack.restore(data.image);
}

// ---------- undo ----------
// a stack of whole-state snapshots, one per command that actually changed something.
// whole-state rather than per-command inverse operations because it's the only way to
// be sure "undo" is exact — a task's reveal progress, archive, and ids all move
// together. session-only on purpose: persisting 20 copies of everything would bloat
// localStorage, and undo is for the mistake you just made, not last week's.
const UNDO_LIMIT = 20;
let undoStack = [];

function pushUndo(label, before){
  if(before === JSON.stringify(buildStateSnapshot())) return;   // command was a no-op — nothing worth undoing
  undoStack.push({ label, before });
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
}

async function cmd_undo(){
  if(undoStack.length === 0){ print('nothing to undo', 'info'); return; }
  const entry = undoStack.pop();
  applyStateSnapshot(JSON.parse(entry.before));
  applyTheme();
  applyView();
  applyTitle();
  applyStatLine();
  await Promise.all([asciiTrack.resync(), imageTrack.resync()]);   // in case we rewound past a piece switch
  saveState();
  renderPanel();
  print(`undid "${entry.label}" — ${tasks.length} task(s) in the list.`, 'ok');
}

// a gentle, one-line heads-up rather than an error: the app is working fine either
// way (live discovery is what's actually driving it right now), this is purely
// about the *other* way of running it — file:// — quietly showing an old set the
// next time someone opens it that way.
function printStaleSnapshotNotice(){
  const parts = [];
  if(asciiTrack.staleSnapshot) parts.push(`${asciiTrack.staleSnapshot.newFiles.length} ascii file${asciiTrack.staleSnapshot.newFiles.length === 1 ? '' : 's'}`);
  if(imageTrack.staleSnapshot) parts.push(`${imageTrack.staleSnapshot.newFiles.length} image file${imageTrack.staleSnapshot.newFiles.length === 1 ? '' : 's'}`);
  if(!parts.length) return;
  const generatedAt = (asciiTrack.staleSnapshot || imageTrack.staleSnapshot).generatedAt;
  const builtTxt = generatedAt ? ` (built ${new Date(generatedAt).toLocaleString()})` : '';
  print(`note: art-data.js${builtTxt} doesn't know about ${parts.join(' and ')} you've added — run "python3 build_art_data.py" so the offline (file://) copy of this app picks them up too.`, 'info');
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
    if(raw) applyStateSnapshot(JSON.parse(raw));
  }catch(e){ /* nothing stored yet, or storage unavailable */ }
  applyTheme();
  applyView();
  applyTitle();
  applyStatLine();
  try{
    await Promise.all([asciiTrack.init(), imageTrack.init()]);
  }catch(e){
    collectionLoadError = location.protocol === 'file:'
      ? 'could not load the art collection — art-data.js is missing or out of date. run "python3 build_art_data.py" next to this file, then reopen it.'
      : 'could not load the art collection — make sure ascii_art/ and image_art/ are being served alongside this page.';
    print(collectionLoadError, 'err');
  }
  printStaleSnapshotNotice();
  printExportNudge();
  renderPanel();
  if(tasks.length){
    print(`— ${tasks.length} task(s) loaded —`, 'info');
    cmd_list([]);
  } else {
    print('no tasks yet — add one:  add "organize your desk"', 'info');
  }
}
function saveState(){
  try{
    const snapshot = buildStateSnapshot();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    pushAutoBackup(snapshot);
  }catch(e){ print('warning: could not save progress', 'err'); }
}

// ---------- automatic rolling backup ----------
// a second safety net alongside undo: undo is session-only and only covers the
// mistake you just made (see its own comment), so it can't help if the *browser*
// is what loses the state — a wiped localStorage, a new profile, a private window.
// keeping the last few full snapshots under their own key means there's still
// something to fall back to even then, without you having to have remembered to
// export first. still lives in the same localStorage origin, though — this is not
// the durable, leaves-the-browser copy that "export" is (see printExportNudge).
const AUTOBACKUP_LIMIT = 10;
const AUTOBACKUP_MIN_INTERVAL_MS = 10 * 60 * 1000;   // 10 minutes
// in-memory rate-limit clock for the backup below — resets to 0 on reload, which
// is fine, since that just means the first save of a fresh session always backs
// up rather than waiting out a clock nobody remembers. saveState()'s own write to
// STORAGE_KEY (above) is the real, immediate save on every command; this is only
// the bonus rolling copy, and doesn't need to track it command-for-command.
let lastAutoBackupAt = 0;
function loadAutoBackups(){
  try{
    const entries = JSON.parse(localStorage.getItem(AUTOBACKUP_KEY) || '[]');
    return Array.isArray(entries) ? entries : [];
  }catch(e){ return []; }
}
function pushAutoBackup(snapshot){
  // failure here is silent, not printed like saveState()'s own — if the primary
  // write above failed too, that's already been reported once; a second warning
  // about the bonus copy on top of it would just be noise on top of a problem the
  // user already knows about. if only this one fails (primary fine, quota tight),
  // staying quiet matches this app's habit of keeping secondary systems gentle.
  const now = Date.now();
  if(now - lastAutoBackupAt < AUTOBACKUP_MIN_INTERVAL_MS) return;   // rate-limited: skip the read/append/write dance entirely, not just the write
  try{
    const entries = loadAutoBackups();
    entries.push({ at: now, data: snapshot });
    while(entries.length > AUTOBACKUP_LIMIT) entries.shift();
    localStorage.setItem(AUTOBACKUP_KEY, JSON.stringify(entries));
    lastAutoBackupAt = now;
  }catch(e){ /* quota exceeded or storage unavailable — this backup is a bonus, not critical */ }
}

// ---------- typed-command history ----------
// persisted so the up-arrow still has something to say after a reload — losing
// it every refresh was the whole complaint. capped the same way the autobackup
// list is, and just as gentle about failure: this is a convenience, not data.
const HISTORY_LIMIT = 100;
function loadCmdHistory(){
  try{
    const entries = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(entries) ? entries.filter(x => typeof x === 'string') : [];
  }catch(e){ return []; }
}
function pushCmdHistory(val){
  cmdHistory.push(val);
  if(cmdHistory.length > HISTORY_LIMIT) cmdHistory.shift();
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(cmdHistory)); }catch(e){ /* quota exceeded or storage unavailable — same as pushAutoBackup, not worth a warning */ }
}

// manual backup/restore — a safety net for whenever localStorage doesn't stick
// around (a new browser profile, a new Codespace, private browsing, etc.):
// localStorage lives in the browser, tied to the exact origin you loaded the
// page from, not in this project's files, so nothing server-side can prevent
// that. "export" now, "import" later is the reliable workaround.
function cmd_export(){
  const blob = new Blob([JSON.stringify(buildStateSnapshot(), null, 2)], { type:'application/json' });
  const stamp = new Date().toISOString().slice(0, 10);
  triggerDownload(blob, `momentum-backup-${stamp}.json`);
  markExported();
  print(`exported ${tasks.length} task(s) + ${archive.length} archived — save this file somewhere safe.`, 'ok');
}
function markExported(){
  try{ localStorage.setItem(LAST_EXPORT_KEY, String(Date.now())); }catch(e){ /* the export itself already succeeded; missing this timestamp only means the nudge below might fire again sooner than strictly necessary */ }
}
// import doesn't call this — having a file to import from proves that file exists,
// not that the *current* state (which may have moved on since) is saved anywhere.
// only an actual export resets the clock.
const EXPORT_NUDGE_DAYS = 7;
function printExportNudge(){
  if(tasks.length + archive.length === 0) return;          // nothing worth nagging about backing up yet
  let lastExportAt = null;
  try{ const raw = localStorage.getItem(LAST_EXPORT_KEY); if(raw) lastExportAt = parseInt(raw, 10); }catch(e){ /* treat as never exported */ }
  // no export on record: fall back to "first time this app was ever opened" rather
  // than nudging immediately on task #1 — a brand new user hasn't gone a while
  // without exporting yet, they just haven't had the chance to.
  let firstSeenAt = lastExportAt;
  if(!firstSeenAt){
    try{
      firstSeenAt = parseInt(localStorage.getItem(FIRST_SEEN_KEY), 10) || null;
      if(!firstSeenAt){ firstSeenAt = Date.now(); localStorage.setItem(FIRST_SEEN_KEY, String(firstSeenAt)); }
    }catch(e){ firstSeenAt = Date.now(); }
  }
  const daysSince = (Date.now() - firstSeenAt) / (24 * 60 * 60 * 1000);
  if(daysSince < EXPORT_NUDGE_DAYS) return;
  const whenTxt = lastExportAt ? `your last export was ${new Date(lastExportAt).toLocaleDateString()}` : "you've never exported a backup";
  print(`note: ${whenTxt} — type "export" to save an offline copy of your tasks. (there's also an automatic in-browser backup — see "recover" — but that disappears along with everything else if this browser's site data ever gets cleared; export is the one copy that actually leaves the browser.)`, 'info');
}

function cmd_import(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.tasks)) throw new Error('not a momentum backup file');
        applyStateSnapshot(data);
        // same wholesale replacement undo does, so the same repair: the backup names
        // the piece and grid it was saved with, and the loaded art has to follow.
        await Promise.all([asciiTrack.resync(), imageTrack.resync()]);
        saveState(); renderPanel(); cmd_list([]);
        print(`imported ${tasks.length} task(s) + ${archive.length} archived from "${file.name}".`, 'ok');
      }catch(e){
        print(`could not import "${file.name}" — it doesn't look like a momentum backup file.`, 'err');
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

// restores from the rolling backup pushAutoBackup() has been keeping — the
// recovery half of the safety net item 21 asked for. always confirmed, unlike
// import: choosing a file via the native picker is already a deliberate multi-step
// action that works as its own confirmation, but typing "recover 2" is one quick
// command that could land by mistake, and unconditionally replaces everything
// currently in the app the moment it does.
function cmd_recover(arg){
  const entries = loadAutoBackups();
  if(!arg || arg.toLowerCase() === 'list'){
    if(entries.length === 0){ print('no automatic backups yet — they build up as you use the app (see "export" for a backup you can make right now instead).', 'info'); return; }
    print('automatic backups, most recent first — "recover <n>" restores one:');
    entries.slice().reverse().forEach((e, i) => {
      const taskCount = (e.data.tasks || []).length, archCount = (e.data.archive || []).length;
      print(`  ${i + 1}. ${new Date(e.at).toLocaleString()}  —  ${taskCount} task${taskCount === 1 ? '' : 's'}, ${archCount} archived`);
    });
    return;
  }
  const ordered = entries.slice().reverse();
  const n = parseInt(arg, 10);
  if(!Number.isInteger(n) || n < 1 || n > ordered.length){
    print(`usage: recover [list|<n>]  (currently ${ordered.length} backup${ordered.length === 1 ? '' : 's'} — "recover list" to see them)`, 'err');
    return;
  }
  const chosen = ordered[n - 1];
  askConfirm(
    `restore the automatic backup from ${new Date(chosen.at).toLocaleString()}? this replaces everything currently here — tasks, archive, reveal progress — with what was saved back then.`,
    `recover ${n}`,
    async () => {
      applyStateSnapshot(chosen.data);
      applyTheme(); applyView(); applyTitle(); applyStatLine();
      await Promise.all([asciiTrack.resync(), imageTrack.resync()]);
      saveState(); renderPanel(); cmd_list([]);
      print(`restored the backup from ${new Date(chosen.at).toLocaleString()}.`, 'ok');
    }
  );
}

// ---------- rendering ----------
function buildArtworkScene(art, progress){
  const { rows, width, height, cellIndices } = art;
  const revealed = new Set(
    materializeOrder(progress, cellIndices.length).slice(0, progress.revealedCount).map(pos => cellIndices[pos])
  );
  let html = '';
  for(let r = 0; r < height; r++){
    let line = '';
    for(let c = 0; c < width; c++){
      const ch = rows[r][c];
      if(ch === ' '){ line += ' '; continue; }
      const idx = r * width + c;
      // unrevealed cells are blank, not placeholder dots: dots traced the artwork's
      // whole silhouette before you'd earned any of it, which gave away the picture
      // and took the surprise out of the reveal. rows stay padded to the full width,
      // so the block keeps its size as it fills in.
      line += revealed.has(idx)
        ? `<span style="color:var(--amber)">${escapeHtml(ch)}</span>`
        : ' ';
    }
    html += line + '\n';
  }
  return `<pre class="reveal-scene">${html}</pre>`;
}

function buildImageScene(art, progress){
  const total = art.cols * art.rows;
  const revealed = new Set(materializeOrder(progress, total).slice(0, progress.revealedCount));
  let tiles = '';
  for(let i = 0; i < total; i++){
    tiles += `<div class="tile${revealed.has(i) ? ' revealed' : ''}"></div>`;
  }
  return (
    `<div class="image-stage">` +
      `<div class="image-frame">` +
        `<img class="image-base" src="image_art/${art.file}" alt="${escapeHtml(art.name)}">` +
        `<div class="tile-grid" style="grid-template-columns:repeat(${art.cols},1fr);grid-template-rows:repeat(${art.rows},1fr)">${tiles}</div>` +
      `</div>` +
    `</div>`
  );
}

// sizes a frame in real pixels rather than via CSS aspect-ratio, because the
// frame's own children are absolutely positioned (so it has no intrinsic
// content size for the browser's auto-sizing to key off). starts from the
// reveal grid's cols/rows as an approximate ratio (so there's a correctly-shaped
// box on first paint), then corrects to the photo's real aspect ratio once it
// loads. raster photos are additionally capped at their native pixel size so
// small images never get blown up past their real resolution; vector art has
// no such ceiling and is free to fill the available space. shared by the
// in-panel view and the fullscreen "display" overlay — they only differ in
// what counts as "available space" (getAvail). returns the layout function so
// the caller can re-run it (e.g. on resize).
function fitFrameToAvail(frame, img, art, getAvail){
  const isVector = /\.svg($|\?)/i.test(art.file);
  let ratio = art.cols / art.rows;

  function layout(){
    const { w: availW, h: availH } = getAvail();
    if(!availW || !availH) return;
    let w = availW, h = w / ratio;
    if(h > availH){ h = availH; w = h * ratio; }
    if(!isVector && img.naturalWidth && w > img.naturalWidth){
      w = img.naturalWidth; h = img.naturalHeight;
    }
    frame.style.width = `${w}px`;
    frame.style.height = `${h}px`;
  }

  const onLoad = () => {
    if(img.naturalWidth && img.naturalHeight) ratio = img.naturalWidth / img.naturalHeight;
    layout();
  };
  if(img.complete) onLoad(); else img.addEventListener('load', onLoad, { once:true });

  layout();
  return layout;
}

// a manifest entry pointing at a file that's been deleted (or never existed) shows
// up as nothing more than the browser's own broken-image icon sitting inside the
// tile frame, with no indication why — and the reveal tiles on top of it still
// "work" in the sense that they animate away, giving no hint anything is wrong.
// rather than sit there broken, this treats it as unplayable and moves straight to
// the next piece, the same way "next" does, with a printed reason so it's not a
// silent jump. brokenImageStreak guards against every image in the manifest being
// broken at once (a misconfigured image_art/, say) turning this into a silent
// infinite loop — it caps at one skip attempt per image in the manifest, then
// stops and says so plainly instead of hammering the network forever. a
// successful load anywhere resets it, so one bad file doesn't poison the count
// against images that load fine later.
async function handleImageLoadError(art){
  brokenImageStreak++;
  print(`could not load "${art.name}" — image_art/${art.file} is missing or unreadable.`, 'err');
  const manifestSize = (imageTrack.manifest && imageTrack.manifest.images && imageTrack.manifest.images.length) || 1;
  if(brokenImageStreak >= manifestSize){
    print(`that's every image in the collection failing to load — stopping here instead of skipping forever. check that the files under image_art/ actually exist, then reload.`, 'err');
    return;
  }
  print('skipping to the next piece...', 'info');
  await imageTrack.startNew();
  const spent = await imageTrack.applyBanked(a => printCompletionPrompt(a));
  if(spent) print(`(spent ${spent} banked completion${spent === 1 ? '' : 's'} on it)`, 'info');
  saveState(); renderPanel();
}

let imageResizeObserver = null;
function fitImageFrame(container, art){
  const stage = container.querySelector('.image-stage');
  const frame = container.querySelector('.image-frame');
  const img = container.querySelector('.image-base');
  if(imageResizeObserver){ imageResizeObserver.disconnect(); imageResizeObserver = null; }
  if(!stage || !frame || !img) return;

  // each render creates a fresh <img>, so this is re-wired every time rather than
  // once — there's no stale listener to worry about, but also no way to skip it.
  img.onerror = () => handleImageLoadError(art);
  img.onload = () => { brokenImageStreak = 0; };

  const layout = fitFrameToAvail(frame, img, art, () => {
    const cs = getComputedStyle(stage);
    return {
      w: stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
      h: stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom),
    };
  });
  imageResizeObserver = new ResizeObserver(layout);
  imageResizeObserver.observe(stage);
}

// ---------- fullscreen "display" ----------
// shows the current piece's live reveal state (not the pristine source file)
// stretched as large as the screen allows. works for both tracks: images keep the
// contain/no-upscale rules of the in-panel view, ascii art is scaled up by measuring
// its natural size and transforming to fit. exits on escape/enter/space or a click.
const FULLSCREEN_EXIT_KEYS = ['Escape', 'Enter', ' '];
let fullscreenEl = null, fullscreenResizeHandler = null;
function handleFullscreenKey(e){
  if(FULLSCREEN_EXIT_KEYS.includes(e.key)){
    e.preventDefault();                                  // space would otherwise scroll the page behind the overlay
    closeFullscreen();
  }
}
function closeFullscreen(){
  if(!fullscreenEl) return;
  fullscreenEl.remove();
  fullscreenEl = null;
  if(fullscreenResizeHandler){ window.removeEventListener('resize', fullscreenResizeHandler); fullscreenResizeHandler = null; }
  document.removeEventListener('keydown', handleFullscreenKey);
  cmdInput.focus();
}
// both openers build their own content, then hand the finished layout function here
// so the exit wiring (click, keys, resize, focus) lives in exactly one place.
function mountFullscreen(innerHTML){
  // tear down any overlay that's already up first. without this, a second "display"
  // orphans the first one: it stays in the DOM, only the newest is tracked, so no
  // key or click can ever remove it and the screen is stuck black.
  closeFullscreen();
