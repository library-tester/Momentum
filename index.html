<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- without this a phone renders the page at a virtual 980px and then scales it
     down to fit, so every one of the layout rules below is measured against a
     width the device doesn't have — the media query never matches and the whole
     app arrives zoomed out to unreadable. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum - yet another task manager</title>
<script src="art-data.js"></script>
<!-- both generated by their build_*.py scripts, and both loaded as plain <script>
     for the same reason: under file:// a browser can't fetch() a directory listing,
     so "what's in ascii_art/image_art" and "what's in fonts/" have to arrive as
     already-written-down data. -->
<script src="font-data.js"></script>
<link rel="stylesheet" href="momentum.css">
</head>
<body>

<header>
  <!-- a real <a>, not a click handler: middle-click, ctrl-click, "copy link" and
       keyboard focus all come free, and none of them would if this were script. -->
  <div class="title"><a href="https://github.com/library-tester/experimental_task_manager"
      target="_blank" rel="noopener noreferrer" title="Momentum on GitHub"><span>MOMENTUM</span></a></div>
  <div class="stats" id="stats">loading...</div>
  <!-- the clickable command row. built by renderHelpLine() rather than written out
       here, because which commands it can offer depends on which features are on. -->
  <div class="helpline" id="helpline"></div>
</header>

<div id="main">
  <div id="term-wrap">
    <div id="list-pane" class="slot-stacked"></div>
    <div id="split-divider" title="drag to resize"></div>
    <div id="console">
      <div id="output"></div>
      <div id="input-area">
        <div id="tab-hint"></div>
        <div id="input-row">
          <span id="prompt">$</span>
          <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus />
        </div>
      </div>
    </div>
  </div>
  <div id="col-divider" title="drag to resize"></div>
  <div id="reveal-panel" class="slot-side"></div>
</div>

<script src="app-state.js"></script>
<script src="app-art.js"></script>
<script src="app-commands.js"></script>
<script src="app-render.js"></script>
</body>
</html>
