<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>garden — ascii task manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-dark:   #1a1410;
    --soil-panel:  #221a14;
    --soil-line:   #3a2c1e;
    --text-dim:    #a8926f;
    --text-main:   #e8dcc0;
    --amber:       #d9a441;
    --moss:        #6b9b6e;
    --moss-dim:    #4a6b4d;
    --brick:       #c96a5a;
    --dusk-blue:   #7fa8c9;
    --wilt:        #6b5a4a;
    --error:       #c96a5a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--soil-dark);
    color:var(--text-main);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:14px 20px 10px;
    border-bottom:1px solid var(--soil-line);
    flex-shrink:0;
  }
  header .title{
    font-size:17px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--amber);
  }
  header .title span{ color:var(--moss); }
  header .stats{
    margin-top:4px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  #garden{
    flex:1 1 55%;
    overflow-y:auto;
    padding:18px 20px;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:6px 10px;
    border-bottom:1px solid var(--soil-line);
    min-height:120px;
  }
  .empty-bed{
    color:var(--text-dim);
    font-size:13px;
    padding:20px 0;
  }
  .flower-cell{
    width:88px;
    text-align:center;
    cursor:default;
  }
  .flower-cell pre{
    margin:0;
    font-size:13px;
    line-height:1.15;
    white-space:pre;
  }
  .flower-cell .soil-row{ color:var(--soil-line); }
  .flower-cell .label{
    font-size:9px;
    color:var(--text-dim);
    margin-top:2px;
    white-space:normal;
    overflow-wrap:break-word;
    word-break:break-word;
    line-height:1.3;
  }
  #term-wrap{
    flex:1 1 45%;
    display:flex;
    flex-direction:column;
    min-height:120px;
  }
  #output{
    flex:1;
    overflow-y:auto;
    padding:12px 20px;
    font-size:13px;
    line-height:1.5;
  }
  #output .line{ white-space:pre-wrap; }
  #output .ok{ color:var(--moss); }
  #output .err{ color:var(--error); }
  #output .info{ color:var(--text-dim); }
  #output .echo{ color:var(--text-main); }
  #output .echo::before{ content:"garden $ "; color:var(--amber); }
  #input-row{
    display:flex;
    align-items:center;
    padding:8px 20px 14px;
    border-top:1px solid var(--soil-line);
    flex-shrink:0;
  }
  #prompt{ color:var(--amber); margin-right:8px; font-size:13px; }
  #cmd{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-main);
    font-family:inherit;
    font-size:13px;
  }
  ::selection{ background:var(--moss-dim); }
  #output::-webkit-scrollbar, #garden::-webkit-scrollbar{ width:8px; }
  #output::-webkit-scrollbar-thumb, #garden::-webkit-scrollbar-thumb{ background:var(--soil-line); border-radius:4px; }
</style>
</head>
<body>

<header>
  <div class="title">🌱 <span>THE GARDEN</span> — ascii task manager</div>
  <div class="stats" id="stats">loading...</div>
</header>

<div id="garden"></div>

<div id="term-wrap">
  <div id="output"></div>
  <div id="input-row">
    <span id="prompt">garden $</span>
    <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus />
  </div>
</div>

<script>
// ---------- state ----------
let tasks = [];
let nextId = 1;
let history = [];
let histIdx = -1;

const STORAGE_KEY = 'garden-tasks-v1';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      tasks = data.tasks || [];
      nextId = data.nextId || 1;
    }
  }catch(e){ /* nothing stored yet */ }
  renderGarden();
}
async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({tasks, nextId}), false);
  }catch(e){ print('warning: could not save progress', 'err'); }
}

// ---------- flower art ----------
// each stage is 4 rows (top->bottom, above soil), each row exactly 5 chars
const STAGES = {
  seed:    ['     ','     ','     ','  .  '],
  growing: ['     ',' \\|/ ','  |  ','  |  '],
  bloom:   ['\\ | /','-(S)-',' /|\\ ','  |  '],
  wilted:  ['     ',' ,_. ','  \\  ','  |  '],
};
const SOIL_ROW = '\u2594\u2594\u2594\u2594\u2594';

const PRIORITY_SYMBOL = { high:'*', med:'@', low:'o' };
const PRIORITY_COLOR  = { high:'var(--brick)', med:'var(--amber)', low:'var(--dusk-blue)' };

function isOverdue(t){
  if(!t.due || t.status === 'done') return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(t.due + 'T00:00:00');
  return d < today;
}

function stageFor(t){
  if(t.status === 'done') return 'bloom';
  if(isOverdue(t)) return 'wilted';
  if(t.status === 'active') return 'growing';
  return 'seed';
}

function colorFor(t, stage){
  if(stage === 'bloom') return PRIORITY_COLOR[t.priority] || 'var(--amber)';
  if(stage === 'growing') return 'var(--moss)';
  if(stage === 'wilted') return 'var(--wilt)';
  return 'var(--text-dim)';
}

function renderGarden(){
  const g = document.getElementById('garden');
  g.innerHTML = '';
  if(tasks.length === 0){
    g.innerHTML = '<div class="empty-bed">the soil is empty. plant something:  add "water the office plants"</div>';
    updateStats();
    return;
  }
  tasks.forEach(t=>{
    const stage = stageFor(t);
    const rows = STAGES[stage].map(r => r.replace('S', PRIORITY_SYMBOL[t.priority] || '*'));
    const color = colorFor(t, stage);
    const cell = document.createElement('div');
    cell.className = 'flower-cell';
    const dueTxt = t.due ? ` — due ${t.due}` : '';
    cell.title = `#${t.id} ${t.title} [${t.priority}] (${t.status})${dueTxt}`;
    const art = document.createElement('pre');
    art.style.color = color;
    art.innerHTML = rows.join('\n') + '\n' + `<span class="soil-row">${SOIL_ROW}</span>`;
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = `#${t.id} ${t.title}`;
    cell.appendChild(art);
    cell.appendChild(label);
    g.appendChild(cell);
  });
  updateStats();
}

function updateStats(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const active = tasks.filter(t=>t.status==='active').length;
  const overdue = tasks.filter(isOverdue).length;
  document.getElementById('stats').textContent =
    `${total} planted · ${done} bloomed · ${active} growing · ${overdue} wilted`;
}

// ---------- terminal ----------
const outputEl = document.getElementById('output');
function print(text, cls){
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' '+cls : '');
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}
function printEcho(text){
  const div = document.createElement('div');
  div.className = 'line echo';
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function tokenize(str){
  const re = /"([^"]*)"|(\S+)/g;
  const out = [];
  let m;
  while((m = re.exec(str)) !== null){ out.push(m[1] !== undefined ? m[1] : m[2]); }
  return out;
}

function findTask(idStr){
  const id = parseInt(idStr, 10);
  return tasks.find(t => t.id === id);
}

const HELP_TEXT =
`commands:
  add "task title" [-p high|med|low] [-d YYYY-MM-DD]   plant a new task
  start <id>                                           mark a task active (sprouts)
  done <id>                                             complete a task (blooms)
  rm <id>                                               delete a task
  priority <id> <high|med|low>                          change priority
  due <id> <YYYY-MM-DD|none>                            set or clear a due date
  list [all|pending|active|done]                        show tasks as text
  stats                                                  garden summary
  clear                                                  clear the terminal
  help                                                   show this list`;

function cmd_add(args){
  const title = args._[0];
  if(!title){ print('add needs a title, e.g. add "water the plants"', 'err'); return; }
  let priority = 'med', due = null;
  if(args.p){
    const p = args.p.toLowerCase();
    if(!['high','med','low'].includes(p)){ print('priority must be high, med, or low', 'err'); return; }
    priority = p;
  }
  if(args.d){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(args.d)){ print('due date must look like YYYY-MM-DD', 'err'); return; }
    due = args.d;
  }
  const t = { id: nextId++, title, status:'pending', priority, due, createdAt: Date.now() };
  tasks.push(t);
  print(`planted #${t.id} "${title}" [${priority}]${due ? ' due '+due : ''}`, 'ok');
  saveState(); renderGarden();
}

function cmd_start(idStr){
  const t = findTask(idStr);
  if(!t){ print(`no task #${idStr}`, 'err'); return; }
  if(t.status === 'done'){ print(`#${t.id} is already bloomed`, 'err'); return; }
  t.status = 'active';
  print(`#${t.id} "${t.title}" is sprouting`, 'ok');
  saveState(); renderGarden();
}

function cmd_done(idStr){
  const t = findTask(idStr);
  if(!t){ print(`no task #${idStr}`, 'err'); return; }
  t.status = 'done';
  t.completedAt = Date.now();
  print(`#${t.id} "${t.title}" bloomed!`, 'ok');
  saveState(); renderGarden();
}

function cmd_rm(idStr){
  const t = findTask(idStr);
  if(!t){ print(`no task #${idStr}`, 'err'); return; }
  tasks = tasks.filter(x => x.id !== t.id);
  print(`pulled #${t.id} "${t.title}" from the bed`, 'ok');
  saveState(); renderGarden();
}

function cmd_priority(idStr, p){
  const t = findTask(idStr);
  if(!t){ print(`no task #${idStr}`, 'err'); return; }
  p = (p||'').toLowerCase();
  if(!['high','med','low'].includes(p)){ print('priority must be high, med, or low', 'err'); return; }
  t.priority = p;
  print(`#${t.id} priority set to ${p}`, 'ok');
  saveState(); renderGarden();
}

function cmd_due(idStr, dateStr){
  const t = findTask(idStr);
  if(!t){ print(`no task #${idStr}`, 'err'); return; }
  if(dateStr === 'none'){ t.due = null; print(`#${t.id} due date cleared`, 'ok'); }
  else if(/^\d{4}-\d{2}-\d{2}$/.test(dateStr)){ t.due = dateStr; print(`#${t.id} due ${dateStr}`, 'ok'); }
  else { print('due date must look like YYYY-MM-DD, or "none"', 'err'); return; }
  saveState(); renderGarden();
}

function cmd_list(filter){
  filter = filter || 'all';
  let list = tasks;
  if(filter === 'pending') list = tasks.filter(t=>t.status==='pending');
  else if(filter === 'active') list = tasks.filter(t=>t.status==='active');
  else if(filter === 'done') list = tasks.filter(t=>t.status==='done');
  if(list.length === 0){ print('nothing here.', 'info'); return; }
  list.forEach(t=>{
    const flag = isOverdue(t) ? ' [OVERDUE]' : '';
    const due = t.due ? ` due:${t.due}` : '';
    print(`#${t.id}  [${t.status}]  (${t.priority})  ${t.title}${due}${flag}`);
  });
}

function cmd_stats(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const active = tasks.filter(t=>t.status==='active').length;
  const pending = tasks.filter(t=>t.status==='pending').length;
  const overdue = tasks.filter(isOverdue).length;
  print(`total: ${total}   bloomed: ${done}   growing: ${active}   seeds: ${pending}   overdue: ${overdue}`);
}

function parseFlags(tokens){
  // tokens[0] is the title (first non-flag token), rest are -p / -d flags
  const args = { _: [] };
  for(let i=0;i<tokens.length;i++){
    const tk = tokens[i];
    if(tk === '-p'){ args.p = tokens[++i]; }
    else if(tk === '-d'){ args.d = tokens[++i]; }
    else { args._.push(tk); }
  }
  return args;
}

function handleCommand(raw){
  const tokens = tokenize(raw.trim());
  if(tokens.length === 0) return;
  const cmd = tokens[0].toLowerCase();
  const rest = tokens.slice(1);

  switch(cmd){
    case 'help': print(HELP_TEXT); break;
    case 'add': cmd_add(parseFlags(rest)); break;
    case 'start': cmd_start(rest[0]); break;
    case 'done': cmd_done(rest[0]); break;
    case 'rm': case 'delete': cmd_rm(rest[0]); break;
    case 'priority': cmd_priority(rest[0], rest[1]); break;
    case 'due': cmd_due(rest[0], rest[1]); break;
    case 'list': cmd_list(rest[0]); break;
    case 'stats': cmd_stats(); break;
    case 'clear': outputEl.innerHTML = ''; break;
    default: print(`unknown command "${cmd}" — try "help"`, 'err');
  }
}

// ---------- input wiring ----------
const cmdInput = document.getElementById('cmd');
cmdInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    const val = cmdInput.value;
    if(val.trim() !== ''){
      printEcho(val);
      history.push(val);
      histIdx = history.length;
      handleCommand(val);
    }
    cmdInput.value = '';
  } else if(e.key === 'ArrowUp'){
    if(histIdx > 0){ histIdx--; cmdInput.value = history[histIdx]; }
    e.preventDefault();
  } else if(e.key === 'ArrowDown'){
    if(histIdx < history.length - 1){ histIdx++; cmdInput.value = history[histIdx]; }
    else { histIdx = history.length; cmdInput.value = ''; }
    e.preventDefault();
  }
});
document.body.addEventListener('click', ()=> cmdInput.focus());

// ---------- boot ----------
print('welcome to the garden. type "help" to see what you can plant.', 'info');
loadState();
</script>
</body>
</html>
